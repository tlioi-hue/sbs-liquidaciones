<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SBS · Socios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --bg: #0b0c0c; --card: #151717; --line: rgba(255,255,255,.09); --txt: #f3f4f3; --mut: #9aa19e; --cel: #8bbcf2; --cel2: #1a3a6e; --ok: #4cbf7a; --neg: #e0913c; --mono: 'Poppins', system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: 'Poppins', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; font-weight: 500; color: var(--mut); }
/* encabezado */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 14px; background: linear-gradient(var(--bg) 60%, transparent); }
.marca { display: flex; align-items: center; gap: 10px; font-size: 16px; text-decoration: none; } .marca img { width: 30px; height: 30px; border-radius: 7px; } .marca b { font-weight: 700; }
.pills { margin-left: auto; display: flex; gap: 8px; }
.pill { font: inherit; font-size: 14px; font-weight: 500; color: var(--txt); background: #1b1d1d; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.pill:hover { background: #242727; }
/* portada */
.hero { padding: clamp(20px, 6vh, 70px) clamp(18px, 4vw, 44px) 30px; max-width: 1240px; }
h1 { font-size: clamp(42px, 8vw, 100px); line-height: 1; letter-spacing: -.035em; margin: 0 0 22px; font-weight: 300; }
h1 b { font-weight: 700; } h1 em { font-style: normal; font-weight: 700; color: var(--cel); }
.sub { font-size: clamp(15px, 1.6vw, 18px); color: #c9cecb; max-width: 620px; line-height: 1.5; margin: 0 0 34px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(14px, 3vw, 40px); max-width: 1100px; }
.kpi { min-width: 0; } .kpi b { display: block; font-size: clamp(24px, 3.4vw, 44px); font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-bottom: 8px; white-space: nowrap; }
.kpi b.org { color: var(--cel); } .kpi b.pos { color: var(--ok); }
/* secciones */
section.sec { padding: 46px clamp(18px, 4vw, 44px) 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h2 { font-size: clamp(28px, 4vw, 48px); letter-spacing: -.03em; margin: 0; font-weight: 300; line-height: 1.05; } h2 b { font-weight: 700; }
.carril { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
.tj { flex: 0 0 clamp(270px, 30vw, 340px); scroll-snap-align: start; min-height: 400px; border-radius: 26px; padding: 18px; position: relative; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 80% at 80% 0%, rgba(90,150,230,.42), transparent 60%), linear-gradient(180deg, #161c24, #0e1116); border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .2s; }
.tj:hover { transform: translateY(-4px); }
.tj.proy { background: radial-gradient(120% 80% at 80% 0%, rgba(139,188,242,.16), transparent 60%), linear-gradient(180deg, #14181d, #0e1013); border-style: dashed; border-color: rgba(139,188,242,.4); }
.tj.anio { background: radial-gradient(120% 80% at 80% 0%, rgba(26,58,110,.9), transparent 70%), linear-gradient(180deg, #121a26, #0d1016); }
.tj-top { display: flex; justify-content: space-between; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; backdrop-filter: blur(6px); }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); } .tag.neg i { background: var(--neg); } .tag.p i { background: var(--cel); }
.tj-n { font-family: var(--mono); font-size: 12px; color: var(--mut); }
.tj h3 { margin: auto 0 4px; font-size: clamp(30px, 3.1vw, 38px); overflow-wrap: anywhere; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.tj .anio-l { font-size: 15px; color: #c9cecb; margin-bottom: 14px; }
.tj-box { background: rgba(0,0,0,.42); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(6px); }
.tj-box .r { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; } .tj-box .r { gap: 10px; } .tj-box .r b { font-size: 17px; font-weight: 700; white-space: nowrap; } .tj-box .r b.pos { color: var(--ok); } .tj-box .r b.neg { color: var(--neg); }
.tj-go { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; background: var(--txt); color: #111; border-radius: 999px; padding: 10px 16px; align-self: flex-start; }
.vacio { color: var(--mut); font-size: 14px; padding: 18px 0; }
footer { padding: 50px clamp(18px, 4vw, 44px) calc(90px + env(safe-area-inset-bottom)); color: var(--mut); font-size: 12px; }
.sello { position: fixed; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 15; background: #f3f4f3; color: #111; border-radius: 999px; padding: 8px 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
/* visor del informe */
.visor { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; }
.visor.on { display: flex; }
.visor-top { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
.visor-top b { font-size: 15px; } .visor-top .mono { margin-left: 4px; }
.x { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: #1b1d1d; color: var(--txt); font-size: 20px; cursor: pointer; }
.visor iframe { flex: 1; width: 100%; border: 0; background: #f4f5f4; }
/* intro tipo historia */
.intro { position: fixed; inset: 0; z-index: 60; background: radial-gradient(90% 70% at 70% 30%, rgba(90,150,230,.26), transparent 60%), radial-gradient(70% 60% at 10% 90%, rgba(26,58,110,.5), transparent 60%), #070809; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 30px; }
.intro .barras { display: flex; gap: 6px; } .intro .barras span { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; } .intro .barras span i { display: block; height: 100%; width: 0; background: #fff; }
.intro .saltar { position: absolute; right: clamp(18px, 4vw, 44px); top: calc(34px + env(safe-area-inset-top)); }
#slide { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.slide { max-width: 1100px; animation: aparecer .7s ease both; }
.slide img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 24px; }
@keyframes aparecer { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.estado { max-width: 520px; margin: 18vh auto; text-align: center; padding: 0 20px; } .estado b { display: block; font-size: 26px; margin-bottom: 8px; } .estado span { color: var(--mut); }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pills .pill { padding: 8px 12px; font-size: 13px; } .marca span { display: none; } }
</style>
</head>

function totales(x) {

window.abrir = function(token) {

  $('visor-f').src = `informe.html?t=${encodeURIComponent(token)}&embed=1`;
  $('visor').classList.add('on'); document.body.style.overflow = 'hidden';
  try { history.pushState({ i: token }, '', `${location.pathname}?k=${encodeURIComponent(CLAVE)}&i=${encodeURIComponent(token)}`); } catch {}
};
window.cerrarVisor = function(desdeHistorial) {
  $('visor').classList.remove('on'); $('visor-f').src = 'about:blank'; document.body.style.overflow = '';

};

// Intro tipo historia (solo la primera vez en cada dispositivo)
function intro() {
  const res = LISTA.filter(x => x.tipo === 'mes').sort((a, b) => String(b.periodo).localeCompare(String(a.periodo)));
  const ult = res[0], t = ult ? totales(ult) : null;
  const slides = [
    `<img src="${LOGO}" alt=""><h1 style="margin:0"><b>Show Business</b><br>Solutions</h1>`,
    `<h1 style="margin:0">Portal de <b>socios</b><br><em>Movistar Arena</em></h1><p class="sub" style="margin-top:20px">Resultados de cada mes y proyecciones, en un solo lugar.</p>`,
    ...(t ? [`<div class="mono" style="margin-bottom:12px">${esc(nomMes(ult.periodo).mes)} ${esc(nomMes(ult.periodo).anio)} · resultado neto</div><h1 style="margin:0"><em>${corto(t.neto)}</em></h1>
      <div class="kpis" style="margin-top:30px"><div class="kpi"><b>${corto(t.ing)}</b><span class="mono">Ingresos</span></div><div class="kpi"><b>${pct(t.neto, t.ing)}</b><span class="mono">Margen</span></div><div class="kpi"><b>${t.shows}</b><span class="mono">Shows</span></div></div>`] : []),
  ];
  const ov = document.createElement('div'); ov.className = 'intro';
  ov.innerHTML = `<div class="barras">${slides.map(() => '<span><i></i></span>').join('')}</div><button class="pill saltar" onclick="finIntro()">Saltar →</button><div id="slide"></div>`;
  document.body.appendChild(ov);
  let k = 0, t0 = 0, raf; const DUR = 3200;
  const mostrar = () => { $('slide').innerHTML = `<div class="slide">${slides[k]}</div>`; t0 = performance.now(); };
  const tick = now => { const p = Math.min(1, (now - t0) / DUR); ov.querySelectorAll('.barras i').forEach((b, j) => b.style.width = j < k ? '100%' : j === k ? p * 100 + '%' : '0');
    if (p >= 1) { if (++k >= slides.length) return finIntro(); mostrar(); } raf = requestAnimationFrame(tick); };
  window.finIntro = () => { cancelAnimationFrame(raf); ov.style.transition = 'opacity .4s'; ov.style.opacity = '0'; setTimeout(() => ov.remove(), 400); try { localStorage.setItem('sbs_portal_intro', '1'); } catch {} };
  mostrar(); raf = requestAnimationFrame(tick);
}
(async function () {
  if (!CLAVE) return estado('Falta el código de acceso', 'Entrá con el link completo que te pasaron.');
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_portal_informes', { p_clave: CLAVE });
    if (error) return estado('No se pudo abrir el portal', /no v[aá]lido/i.test(error.message || '') ? 'El link no es válido o está incompleto. Pedí el link actualizado.' : 'Probá de nuevo en un rato.');
    LISTA = (data || []).filter(x => x.token);
    if (!LISTA.length) return estado('Todavía no hay informes publicados', 'Cuando se publique el primero, va a aparecer acá.');
    // los números de cada tarjeta salen del propio informe publicado
    await Promise.all(LISTA.map(async x => { try { const r = await sb.rpc('get_informe', { p_token: x.token }); x.data = r.data?.data || null; } catch {} }));
    dibujar();
    const pedido = new URLSearchParams(location.search).get('i');
    if (pedido && LISTA.some(x => x.token === pedido)) abrir(pedido);
    else { let visto = false; try { visto = !!localStorage.getItem('sbs_portal_intro'); } catch {} if (!visto) intro(); }
  } catch (e) { estado('No se pudo abrir el portal', 'Probá de nuevo en un rato.'); }
})();
</script>
