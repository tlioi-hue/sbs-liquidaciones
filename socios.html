<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SBS · Socios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --bg: #ffffff; --card: #f5f7fa; --line: rgba(0,0,0,.08); --txt: #0b0c0c; --mut: #5f6b66; --cel: #3b82d6; --celsoft: #e8f0fa; --cel2: #1a3a6e; --ok: #1f8a4c; --neg: #c26a1a; --mono: 'Poppins', system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: 'Poppins', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.mono { font-family: var(--mono); letter-spacing: .01em; font-size: 12.5px; font-weight: 500; color: var(--mut); }
/* barra: negra semitransparente */
header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 12px;
  background: rgba(11,12,12,.82); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.marca { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; text-decoration: none; color: #fff; } .marca img { width: 34px; height: 34px; border-radius: 8px; }
.pills { margin-left: auto; display: flex; gap: 8px; }
.pill { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 9px 16px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.pill:hover { background: var(--cel); border-color: var(--cel); }
/* portada */
.hero { padding: clamp(24px, 6vh, 70px) clamp(18px, 4vw, 44px) 30px; max-width: 1240px; }
h1 { font-size: clamp(42px, 8vw, 100px); line-height: 1; letter-spacing: -.035em; margin: 0 0 22px; font-weight: 300; }
h1 b { font-weight: 700; } h1 em { font-style: normal; font-weight: 700; color: var(--cel); }
.sub { font-size: clamp(15px, 1.6vw, 18px); color: #3d4744; max-width: 620px; line-height: 1.55; margin: 0 0 34px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(14px, 3vw, 40px); max-width: 1100px; }
.kpi { min-width: 0; } .kpi b { display: block; font-size: clamp(24px, 3.4vw, 44px); font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-bottom: 8px; white-space: nowrap; }
.kpi b.org { color: #2a6cc4; text-shadow: 0 2px 0 rgba(26,58,110,.25); } .kpi b.pos { color: var(--ok); }
/* secciones */
section.sec { padding: 46px clamp(18px, 4vw, 44px) 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h2 { font-size: clamp(28px, 4vw, 48px); letter-spacing: -.03em; margin: 0; font-weight: 300; line-height: 1.05; } h2 b { font-weight: 700; }
.carril { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; scrollbar-width: thin; scrollbar-color: #cfd6dd transparent; }
.tj { flex: 0 0 clamp(270px, 30vw, 340px); scroll-snap-align: start; min-height: 400px; border-radius: 26px; padding: 18px; position: relative; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 80% at 80% 0%, rgba(59,130,214,.28), transparent 62%), linear-gradient(180deg, #f6f9fd, #edf2f8); border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
.tj:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(26,58,110,.14); }
.tj.proy { background: radial-gradient(120% 80% at 80% 0%, rgba(59,130,214,.14), transparent 62%), #fbfcfe; border: 1.5px dashed rgba(59,130,214,.55); }
.tj.anio { background: radial-gradient(120% 80% at 80% 0%, rgba(26,58,110,.35), transparent 70%), linear-gradient(180deg, #eef3fa, #e3ebf5); }
.tj-top { display: flex; justify-content: space-between; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); } .tag.neg i { background: var(--neg); } .tag.p i { background: var(--cel); }
.tj-n { font-size: 12px; color: var(--mut); font-weight: 500; }
.tj h3 { margin: auto 0 4px; font-size: clamp(30px, 3.1vw, 38px); overflow-wrap: anywhere; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.tj .anio-l { font-size: 15px; color: #3d4744; margin-bottom: 14px; }
.tj-box { background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.tj-box .r { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; gap: 10px; } .tj-box .r b { font-size: 17px; font-weight: 700; white-space: nowrap; }
.tj-box .r b.pos { color: var(--ok); } .tj-box .r b.neg { color: var(--neg); }
.tj-go { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; background: var(--txt); color: #fff; border-radius: 999px; padding: 10px 16px; align-self: flex-start; }
.vacio { color: var(--mut); font-size: 14px; padding: 18px 0; }
footer { padding: 50px clamp(18px, 4vw, 44px) calc(90px + env(safe-area-inset-bottom)); color: var(--mut); font-size: 12px; }
.sello { position: fixed; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 15; background: rgba(11,12,12,.85); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 11.5px; font-weight: 500; letter-spacing: .01em; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
/* visor del informe */
.visor { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; }
.visor.on { display: flex; }
.visor-top { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: rgba(11,12,12,.88); color: #fff; }
.visor-top b { font-size: 15px; } .visor-top .mono { margin-left: 4px; color: rgba(255,255,255,.7); }
.x { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.12); color: #fff; font-size: 20px; cursor: pointer; }
.visor iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
/* intro tipo historia */
.intro { position: fixed; inset: 0; z-index: 60; background: radial-gradient(90% 70% at 72% 28%, rgba(59,130,214,.20), transparent 60%), radial-gradient(70% 60% at 8% 92%, rgba(26,58,110,.12), transparent 60%), #ffffff; color: var(--txt); display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 30px; }
.intro .barras { display: flex; gap: 6px; } .intro .barras span { flex: 1; height: 3px; border-radius: 3px; background: rgba(0,0,0,.12); overflow: hidden; } .intro .barras span i { display: block; height: 100%; width: 0; background: var(--txt); }
.intro .saltar { position: absolute; right: clamp(18px, 4vw, 44px); top: calc(34px + env(safe-area-inset-top)); background: var(--txt); border-color: var(--txt); }
#slide { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.slide { max-width: 1100px; animation: aparecer .7s ease both; }
.slide img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 24px; }
@keyframes aparecer { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.estado { max-width: 520px; margin: 18vh auto; text-align: center; padding: 0 20px; } .estado b { display: block; font-size: 26px; margin-bottom: 8px; } .estado span { color: var(--mut); }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pills .pill { padding: 8px 12px; font-size: 13px; } .marca span { display: none; } }

/* ═══ Onda: fondo degradado en movimiento, vidrio y animaciones ═══ */
.fondo { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: linear-gradient(160deg, #ffffff 0%, #f3f7fc 45%, #eaf1fa 100%); }
.fondo i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
.fondo i:nth-child(1) { width: 52vw; height: 52vw; left: -12vw; top: -14vw; background: radial-gradient(circle, rgba(59,130,214,.55), transparent 65%); animation: flotar1 26s ease-in-out infinite alternate; }
.fondo i:nth-child(2) { width: 46vw; height: 46vw; right: -14vw; top: 18vh; background: radial-gradient(circle, rgba(139,188,242,.7), transparent 65%); animation: flotar2 31s ease-in-out infinite alternate; }
.fondo i:nth-child(3) { width: 40vw; height: 40vw; left: 22vw; bottom: -18vw; background: radial-gradient(circle, rgba(26,58,110,.28), transparent 65%); animation: flotar3 37s ease-in-out infinite alternate; }
.fondo i:nth-child(4) { width: 30vw; height: 30vw; right: 10vw; bottom: 6vh; background: radial-gradient(circle, rgba(120,200,235,.45), transparent 65%); animation: flotar1 29s ease-in-out infinite alternate-reverse; }
@keyframes flotar1 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(8vw, 6vh) scale(1.12); } 100% { transform: translate(-4vw, 12vh) scale(.95); } }
@keyframes flotar2 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-10vw, 8vh) scale(1.15); } 100% { transform: translate(-3vw, -6vh) scale(1); } }
@keyframes flotar3 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(6vw, -10vh) scale(1.1); } 100% { transform: translate(-8vw, -4vh) scale(1.2); } }
body { background: transparent; }
/* barra: vidrio oscuro, con todo bien visible */
header { background: rgba(11,12,12,.55) !important; -webkit-backdrop-filter: blur(18px) saturate(160%) !important; backdrop-filter: blur(18px) saturate(160%) !important; box-shadow: 0 8px 30px rgba(26,58,110,.18) !important; border-bottom: 1px solid rgba(255,255,255,.12); }
.marca img { box-shadow: 0 0 0 2px #fff; background: #fff; }
.marca span { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.pill { background: #fff !important; color: #0b0c0c !important; border-color: #fff !important; box-shadow: 0 2px 10px rgba(0,0,0,.15); transition: background .2s, color .2s, transform .2s; }
.pill:hover { background: var(--cel) !important; color: #fff !important; border-color: var(--cel) !important; transform: translateY(-1px); }
/* tarjetas de vidrio */
.tj { background: radial-gradient(120% 80% at 80% 0%, rgba(59,130,214,.30), transparent 62%), rgba(255,255,255,.55) !important; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-color: rgba(255,255,255,.7) !important; box-shadow: 0 10px 30px rgba(26,58,110,.08); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
.tj::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(60% 50% at var(--mx, 70%) var(--my, 0%), rgba(59,130,214,.22), transparent 70%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.tj:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 22px 44px rgba(26,58,110,.18); } .tj:hover::after { opacity: 1; }
.tj.proy { background: radial-gradient(120% 80% at 80% 0%, rgba(59,130,214,.16), transparent 62%), rgba(255,255,255,.5) !important; border: 1.5px dashed rgba(59,130,214,.6) !important; }
.tj.anio { background: radial-gradient(120% 80% at 80% 0%, rgba(26,58,110,.35), transparent 70%), rgba(240,245,252,.6) !important; }
.tj-box { background: rgba(255,255,255,.75); }
.tj-go { transition: background .2s, transform .2s; } .tj:hover .tj-go { background: var(--cel); transform: translateX(3px); }
/* aparecer al bajar */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.rv.vis { opacity: 1; transform: none; }
/* título palabra por palabra */
h1 .w { display: inline-block; opacity: 0; transform: translateY(.35em); animation: palabra .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0s); }
@keyframes palabra { to { opacity: 1; transform: none; } }
h1 em .w { filter: drop-shadow(0 3px 0 rgba(26,58,110,.32)); background: linear-gradient(90deg, #2563b8, #4f97e6, #2563b8); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: palabra .9s cubic-bezier(.2,.8,.2,1) var(--d, 0s) forwards, brillo 6s linear infinite; }
@keyframes brillo { to { background-position: 200% center; } }
.sello::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4cbf7a; margin-right: 7px; vertical-align: 1px; animation: latido 2.2s ease-in-out infinite; }
@keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 rgba(76,191,122,.6); } 50% { box-shadow: 0 0 0 6px rgba(76,191,122,0); } }
@media (prefers-reduced-motion: reduce) { .fondo i, h1 em .w, .sello::before { animation: none !important; } h1 em .w { opacity: 1; transform: none; } .rv { opacity: 1; transform: none; transition: none; } h1 .w { animation: none; opacity: 1; transform: none; } }

.hero-dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 1240px; }
.hero-dos.uno { grid-template-columns: minmax(0, 760px); }
.hpanel { background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.75); border-radius: 24px; padding: 18px 20px 20px; box-shadow: 0 10px 30px rgba(26,58,110,.08); }
.hpanel.proy { border: 1.5px dashed rgba(59,130,214,.55); background: rgba(255,255,255,.42); }
.hp-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.hp-h .mono b { color: var(--txt); font-weight: 600; }
.hp-go { font: inherit; font-size: 13px; font-weight: 600; background: var(--txt); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: background .2s, transform .2s; }
.hp-go:hover { background: var(--cel); transform: translateX(2px); }
.hpanel .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.hpanel .kpi b { font-size: clamp(20px, 2.3vw, 32px); }
.hpanel.proy .kpi b.org { color: #2a6cc4; }
.chip-p { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: #1a3a6e; background: #e8f0fa; border: 1px solid #a8c0e0; border-radius: 999px; padding: 3px 10px; margin-left: 6px; }
@media (max-width: 980px) { .hero-dos { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .hpanel .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ═══ Lectura de un informe dentro del portal ═══ */
.visor { background: transparent; }
.visor .fondo { z-index: 0; }
.lec { position: relative; z-index: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.lec-in { max-width: 1080px; margin: 0 auto; padding: clamp(24px, 5vh, 56px) clamp(18px, 4vw, 40px) 90px; }
.lec h1 { font-size: clamp(44px, 8vw, 96px); }
.lec-sub { font-size: clamp(15px, 1.6vw, 19px); color: #2c3633; line-height: 1.55; max-width: 760px; margin: 0 0 8px; }
.lec-sub b { font-weight: 600; color: var(--txt); }
.cap { margin-top: clamp(46px, 8vh, 80px); }
.cap-n { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--cel); margin-bottom: 8px; }
.cap-n span { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--txt); color: #fff; font-size: 11.5px; }
.cap h2 { margin-bottom: 18px; }
.cap .nota { font-size: 13.5px; color: var(--mut); max-width: 720px; line-height: 1.55; margin: 14px 0 0; }
.vidrio { background: rgba(255,255,255,.58); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.8); border-radius: 24px; padding: clamp(16px, 2.4vw, 26px); box-shadow: 0 10px 30px rgba(26,58,110,.08); }
.grande { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
.grande b { font-size: clamp(48px, 8vw, 96px); font-weight: 700; letter-spacing: -.04em; line-height: .95; color: #2a6cc4; text-shadow: 0 3px 0 rgba(26,58,110,.25); }
.grande b.neg { color: var(--neg); }
.grande span { font-size: 15px; color: var(--mut); }
.lec .kpis { margin-bottom: 18px; }
/* barra apilada */
.pila { display: flex; height: 54px; border-radius: 14px; overflow: hidden; background: rgba(26,58,110,.06); }
.pila > div { width: 0; height: 100%; display: flex; align-items: center; padding: 0 14px; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; transition: width 1.2s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.rv.vis .pila > div { width: var(--w); }
.ley { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px 22px; margin-top: 16px; }
.ley > div { display: flex; align-items: baseline; gap: 10px; font-size: 14px; }
.ley i { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; transform: translateY(1px); }
.ley span { flex: 1; } .ley b { font-weight: 700; white-space: nowrap; } .ley em { font-style: normal; color: var(--mut); font-size: 12.5px; width: 52px; text-align: right; }
/* barras horizontales */
.hb { display: flex; flex-direction: column; gap: 12px; }
.hb-r { display: grid; grid-template-columns: minmax(120px, 230px) 1fr minmax(96px, auto); gap: 14px; align-items: center; }
.hb-l { font-size: 14.5px; font-weight: 600; line-height: 1.2; } .hb-l small { display: block; font-weight: 400; font-size: 12px; color: var(--mut); margin-top: 2px; }
.hb-b { height: 16px; border-radius: 8px; background: rgba(26,58,110,.07); overflow: hidden; }
.hb-f { height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, #2563b8, #5a9ee8); transition: width 1.1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.hb-f.neg { background: linear-gradient(90deg, #c26a1a, #e0913c); } .hb-f.suave { background: linear-gradient(90deg, #8db8ec, #b9d4f4); } .hb-f.osc { background: linear-gradient(90deg, #1a3a6e, #2f5b9e); }
.rv.vis .hb-f { width: var(--w); }
.hb-v { text-align: right; font-weight: 700; font-size: 15px; white-space: nowrap; } .hb-v small { display: block; font-weight: 500; font-size: 12px; color: var(--mut); }
.hb-v.pos { color: var(--ok); } .hb-v.neg { color: var(--neg); }
.dests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.dests > div span { display: block; font-size: 12.5px; color: var(--mut); font-weight: 500; } .dests > div b { display: block; font-size: 20px; font-weight: 700; margin: 4px 0 2px; } .dests > div small { font-size: 12.5px; color: var(--mut); }
.supg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.supg > div b { display: block; font-size: clamp(40px, 5vw, 60px); font-weight: 700; letter-spacing: -.03em; line-height: 1; margin: 6px 0; } .supg > div span { font-size: 13px; color: var(--mut); font-weight: 500; } .supg > div small { display: block; font-size: 12.5px; color: var(--mut); }
.lec-fin { margin-top: 60px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn-n { font: inherit; font-size: 14px; font-weight: 600; background: var(--txt); color: #fff; border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; text-decoration: none; transition: background .2s; } .btn-n:hover { background: var(--cel); }
.btn-b { font: inherit; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.7); color: var(--txt); border: 1px solid rgba(0,0,0,.1); border-radius: 999px; padding: 12px 20px; cursor: pointer; }
.tagp { display: inline-flex; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 1px; } .tagp.real { background: #1a3a6e; color: #fff; } .tagp.proy { background: #e8f0fa; color: #1a3a6e; border: 1px dashed #8db8ec; }
@media (max-width: 760px) { .hb-r { grid-template-columns: 1fr auto; } .hb-b { grid-column: 1 / -1; grid-row: 2; } .dests, .supg { grid-template-columns: 1fr 1fr; } }

/* números que se ajustan al ancho real de cada panel (no se pegan) */
.hpanel, .vidrio { container-type: inline-size; }
.hpanel .kpi b { font-size: clamp(18px, 6.4cqi, 32px); }
.vidrio .kpi b { font-size: clamp(18px, 5.6cqi, 40px); }
.kpi b { overflow: hidden; text-overflow: ellipsis; }

const $ = id => document.getElementById(id);
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const corto = v => { const a = Math.abs(v || 0), sg = v < 0 ? '−' : ''; return a >= 1e6 ? `${sg}$${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 })} M` : a >= 1e3 ? `${sg}$${Math.round(a / 1e3)} mil` : `${sg}$${Math.round(a)}`; };
const pct = (a, b) => b ? (a / b * 100).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—';
const nomMes = p => { const [y, m] = String(p).split('-'); return { mes: MESES[+m - 1], anio: y }; };

const RUTA_K = (location.pathname.match(/\/socios\/([^/?#]+)/) || [])[1] || '';

const CLAVE_PORTAL = 'WE0z4gfpCp';
const K_QUERY = new URLSearchParams(location.search).get('k') || '';

// La dirección del portal: /socios/CODIGO (corta) o socios.html?k=CODIGO (la de siempre)
const urlPortal = i => (RUTA_K || !K_QUERY) ? `${location.pathname}${i ? `?i=${encodeURIComponent(i)}` : ''}` : `${location.pathname}?k=${encodeURIComponent(CLAVE)}${i ? `&i=${encodeURIComponent(i)}` : ''}`;
let LISTA = [];
function estado(t, s) { $('app').innerHTML = `<div class="estado"><b>${esc(t)}</b><span>${esc(s || '')}</span></div>`; }
// Totales de cada informe: los mensuales/anuales traen "totales"; las proyecciones, "T"
function totales(x) {
  const d = x.data || {};
  if (x.tipo === 'proy') return { ing: d.T?.ingresos || 0, neto: d.T?.neto || 0, shows: (d.shows || []).length, egr: d.T?.egresos || 0 };
  const t = d.totales || {}; return { ing: t.ventas || 0, neto: t.neto || 0, shows: (d.shows || []).length, egr: (t.ventas || 0) - (t.neto || 0) };
}
function tarjeta(x, i) {
  const t = totales(x), m = t.ing ? t.neto / t.ing : 0, cls = x.tipo === 'proy' ? 'proy' : x.tipo === 'anio' ? 'anio' : '';
  const tit = x.tipo === 'anio' ? { mes: 'Año', anio: x.periodo } : nomMes(x.periodo);
  return `<article class="tj ${cls} rv" style="--d:${(i % 6) * .08}s" onmousemove="brilloTj(event,this)" onclick="abrir('${esc(x.token)}')" tabindex="0" onkeydown="if(event.key==='Enter')abrir('${esc(x.token)}')">
    <div class="tj-top"><span class="tag ${x.tipo === 'proy' ? 'p' : t.neto < 0 ? 'neg' : ''}"><i></i>${x.tipo === 'proy' ? 'Proyección' : 'Margen ' + pct(t.neto, t.ing)}</span><span class="tj-n">${String(i + 1).padStart(2, '0')}</span></div>
    <h3>${esc(tit.mes)}</h3><div class="anio-l">${esc(tit.anio)} · ${t.shows} show${t.shows !== 1 ? 's' : ''}${x.tipo === 'proy' ? ' confirmados' : ''}</div>
    <div class="tj-box">
      <div class="r"><span class="mono">${x.tipo === 'proy' ? 'Ingresos estimados' : 'Ingresos'}</span><b>${corto(t.ing)}</b></div>
      <div class="r"><span class="mono">${x.tipo === 'proy' ? 'Resultado proyectado' : 'Resultado neto'}</span><b class="${t.neto < 0 ? 'neg' : 'pos'}">${corto(t.neto)}</b></div>
      ${x.tipo === 'proy' ? `<div class="r"><span class="mono">Margen</span><b>${pct(t.neto, t.ing)}</b></div>` : ''}
    </div>
    <span class="tj-go">${x.tipo === 'proy' ? 'Ver proyección' : 'Ver informe'} →</span>
  </article>`;
}

// Proyección a destacar: la del mes en curso; si no hay, la próxima; si no, la más reciente
function proyVigente(proy) {
  const h = new Date(), mesAct = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, '0')}`;
  const ord = [...proy].sort((a, b) => String(a.periodo).localeCompare(String(b.periodo)));
  return ord.find(x => x.periodo === mesAct) || ord.find(x => x.periodo > mesAct) || ord[ord.length - 1] || null;
}
function dibujar() {
  const res = LISTA.filter(x => x.tipo === 'mes').sort((a, b) => String(b.periodo).localeCompare(String(a.periodo)));
  const anios = LISTA.filter(x => x.tipo === 'anio').sort((a, b) => String(b.periodo).localeCompare(String(a.periodo)));
  const proy = LISTA.filter(x => x.tipo === 'proy').sort((a, b) => String(a.periodo).localeCompare(String(b.periodo)));
  const ult = res[0], tu = ult ? totales(ult) : null, act = LISTA.reduce((a, x) => x.updated_at > a ? x.updated_at : a, '');
  const prox = proyVigente(proy), tp = prox ? totales(prox) : null;
  $('app').innerHTML = `
  <header><a class="marca" href="#top"><img src="${LOGO}" alt="SBS"><span>Show Business Solutions</span></a>
    <nav class="pills">${res.length || anios.length ? '<a class="pill" href="#resultados">Resultados</a>' : ''}${proy.length ? '<a class="pill" href="#proyecciones">Proyecciones</a>' : ''}</nav></header>
  <div class="hero" id="top">

    <p class="sub rv" style="--d:.7s">Resultados de cada mes y proyecciones de lo que viene: cuánto se le facturó al Arena, cuánto costó el personal y cuánto quedó para SBS.</p>
    ${tu || tp ? `<div class="hero-dos ${tu && tp ? '' : 'uno'}">
      ${tu ? `<div class="hpanel rv" style="--d:.85s"><div class="hp-h"><span class="mono">Último informe · <b>${esc(nomMes(ult.periodo).mes)} ${esc(nomMes(ult.periodo).anio)}</b></span><button class="hp-go" onclick="abrir('${esc(ult.token)}')">Ver informe →</button></div>
        <div class="kpis">
          <div class="kpi"><b data-cuenta="${tu.ing}" data-fmt="corto">${corto(tu.ing)}</b><span class="mono">Ingresos sin IVA</span></div>
          <div class="kpi"><b class="org" data-cuenta="${tu.neto}" data-fmt="corto">${corto(tu.neto)}</b><span class="mono">Resultado neto</span></div>
          <div class="kpi"><b data-cuenta="${tu.ing ? tu.neto / tu.ing * 100 : 0}" data-fmt="pct">${pct(tu.neto, tu.ing)}</b><span class="mono">Margen</span></div>
          <div class="kpi"><b data-cuenta="${tu.shows}" data-fmt="ent">${tu.shows}</b><span class="mono">Shows</span></div>
        </div></div>` : ''}
      ${tp ? `<div class="hpanel proy rv" style="--d:1s"><div class="hp-h"><span class="mono">Lo que viene · <b>${esc(nomMes(prox.periodo).mes)} ${esc(nomMes(prox.periodo).anio)}</b><span class="chip-p">Proyección</span></span><button class="hp-go" onclick="abrir('${esc(prox.token)}')">Ver proyección →</button></div>
        <div class="kpis">
          <div class="kpi"><b data-cuenta="${tp.ing}" data-fmt="corto">${corto(tp.ing)}</b><span class="mono">Ingresos estimados</span></div>
          <div class="kpi"><b class="org" data-cuenta="${tp.neto}" data-fmt="corto">${corto(tp.neto)}</b><span class="mono">Resultado proyectado</span></div>
          <div class="kpi"><b data-cuenta="${tp.ing ? tp.neto / tp.ing * 100 : 0}" data-fmt="pct">${pct(tp.neto, tp.ing)}</b><span class="mono">Margen</span></div>
          <div class="kpi"><b data-cuenta="${tp.shows}" data-fmt="ent">${tp.shows}</b><span class="mono">Shows confirmados</span></div>
        </div></div>` : ''}
    </div>` : ''}
  </div>
  ${res.length || anios.length ? `<section class="sec" id="resultados"><div class="sec-h rv"><h2><b>Resultados</b> de cada mes</h2><span class="mono">${res.length} mes${res.length !== 1 ? 'es' : ''} publicado${res.length !== 1 ? 's' : ''}</span></div>

// ── Movimiento: palabras del título, aparición al bajar, números que cuentan y brillo de las tarjetas ──
const quieto = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function palabras(txt, d0) { return txt.split(' ').map((w, k) => `<span class="w" style="--d:${(d0 + k * .12).toFixed(2)}s">${esc(w)}</span>`).join(' '); }
window.brilloTj = function (e, el) { const r = el.getBoundingClientRect(); el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%'); el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%'); };
function animarEntrada() {
  const els = document.querySelectorAll('.rv:not(.vis)');
  if (quieto() || !('IntersectionObserver' in window)) { els.forEach(x => x.classList.add('vis')); return contar(true); }
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('vis'); io.unobserve(en.target); } }), { threshold: .12 });
  els.forEach(x => io.observe(x));
  setTimeout(() => contar(false), 900);
}
function contar(ya) {
  document.querySelectorAll('[data-cuenta]').forEach(b => {
    const fin = +b.dataset.cuenta, fmt = b.dataset.fmt, txt = v => fmt === 'corto' ? corto(v) : fmt === 'pct' ? v.toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : String(Math.round(v));
    if (ya) { b.textContent = txt(fin); return; }
    const t0 = performance.now(), dur = 1400;
    const paso = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); b.textContent = txt(fin * e); if (p < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
}

  ];
  const ov = document.createElement('div'); ov.className = 'intro';
  ov.innerHTML = `<div class="barras">${slides.map(() => '<span><i></i></span>').join('')}</div><button class="pill saltar" onclick="finIntro()">Saltar →</button><div id="slide"></div>`;
  document.body.appendChild(ov);
  let k = 0, t0 = 0, raf; const DUR = 3200;
  const mostrar = () => { $('slide').innerHTML = `<div class="slide">${slides[k]}</div>`; t0 = performance.now(); };
  const tick = now => { const p = Math.min(1, (now - t0) / DUR); ov.querySelectorAll('.barras i').forEach((b, j) => b.style.width = j < k ? '100%' : j === k ? p * 100 + '%' : '0');
    if (p >= 1) { if (++k >= slides.length) return finIntro(); mostrar(); } raf = requestAnimationFrame(tick); };
  window.finIntro = () => { cancelAnimationFrame(raf); ov.style.transition = 'opacity .4s'; ov.style.opacity = '0'; setTimeout(() => ov.remove(), 400); try { localStorage.setItem('sbs_portal_intro', '1'); } catch {} };
  mostrar(); raf = requestAnimationFrame(tick);
}
(async function () {
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_portal_informes', { p_clave: CLAVE });
    if (error) return estado('No se pudo abrir el portal', /no v[aá]lido/i.test(error.message || '') ? 'El link no es válido o está incompleto. Pedí el link actualizado.' : 'Probá de nuevo en un rato.');
    LISTA = (data || []).filter(x => x.token);
    if (!LISTA.length) return estado('Todavía no hay informes publicados', 'Cuando se publique el primero, va a aparecer acá.');
    // los números de cada tarjeta salen del propio informe publicado
    await Promise.all(LISTA.map(async x => { try { const r = await sb.rpc('get_informe', { p_token: x.token }); x.data = r.data?.data || null; } catch {} }));
    dibujar(); animarEntrada();
    const pedido = new URLSearchParams(location.search).get('i');
    if (pedido && LISTA.some(x => x.token === pedido)) abrir(pedido);
    else { let visto = false; try { visto = !!localStorage.getItem('sbs_portal_intro'); } catch {} if (!visto) intro(); }
  } catch (e) { estado('No se pudo abrir el portal', 'Probá de nuevo en un rato.'); }
})();
</script>
