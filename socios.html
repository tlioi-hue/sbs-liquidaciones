const $ = id => document.getElementById(id);
const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const etiqueta = x => x.tipo === 'anio' ? `Año ${x.periodo}` : (() => { const [y, m] = String(x.periodo).split('-'); return `${MESES[+m - 1]} ${y}`; })();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
$('logo').src = LOGO;
function estado(t, sub) { $('main').innerHTML = `<div class="estado"><b>${esc(t)}</b>${esc(sub || '')}</div>`; $('nav').innerHTML = ''; }
let LISTA = [], ACTUAL = null;
function abrir(token) {
  ACTUAL = token;
  document.querySelectorAll('.grupo button').forEach(b => b.classList.toggle('on', b.dataset.t === token));
  $('main').innerHTML = `<iframe src="informe.html?t=${encodeURIComponent(token)}&embed=1" allow="fullscreen" title="Informe"></iframe>`;
  try { history.replaceState(null, '', `${location.pathname}?k=${encodeURIComponent(CLAVE)}&i=${encodeURIComponent(token)}`); } catch {}
}
function dibujarNav() {
  const res = LISTA.filter(x => x.tipo === 'mes' || x.tipo === 'anio').sort((a, b) => (b.tipo === 'anio') - (a.tipo === 'anio') || String(b.periodo).localeCompare(String(a.periodo)));
  const proy = LISTA.filter(x => x.tipo === 'proy').sort((a, b) => String(b.periodo).localeCompare(String(a.periodo)));
  const btn = (x, cls = '') => `<button class="${cls}" data-t="${esc(x.token)}" onclick="abrir('${esc(x.token)}')">${esc(etiqueta(x))}</button>`;
  $('nav').innerHTML = (res.length ? `<div class="grupo"><small>Resultados</small>${res.map(x => btn(x)).join('')}</div>` : '')
    + (proy.length ? `<div class="grupo"><small>Proyecciones</small>${proy.map(x => btn(x, 'p')).join('')}</div>` : '');
}
const CLAVE = new URLSearchParams(location.search).get('k') || '';
(async function () {
  if (!CLAVE) return estado('Falta el código de acceso', 'Entrá con el link completo que te pasaron.');
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_portal_informes', { p_clave: CLAVE });
    if (error) return estado('No se pudo abrir el portal', /no v[aá]lido/i.test(error.message || '') ? 'El link no es válido o está incompleto. Pedí el link actualizado.' : 'Revisá que el link esté completo o probá de nuevo en un rato.');
    LISTA = (data || []).filter(x => x.token);
    if (!LISTA.length) return estado('Todavía no hay informes publicados', 'Cuando se publique el primero, va a aparecer acá.');
    dibujarNav();
    const pedido = new URLSearchParams(location.search).get('i');
    const ultimoMes = LISTA.filter(x => x.tipo === 'mes').sort((a, b) => String(b.periodo).localeCompare(String(a.periodo)))[0];
    abrir(LISTA.some(x => x.token === pedido) ? pedido : (ultimoMes || LISTA[0]).token);
  } catch (e) { estado('No se pudo abrir el portal', 'Probá de nuevo en un rato.'); }
})();
