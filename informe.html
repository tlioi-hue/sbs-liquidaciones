<style>
:root {
  --brand: #2b2b2b; --ink: #1f2421; --muted: #69726d; --rule: #e2e5e3;
  --bg: #f2f3f2; --surface: #ffffff;
  --c-personal: #3f4a45; --c-cargas: #8a968f; --c-imp: #cbb57f; --c-fijo: #a9b3ae; --c-iigg: #a3843a;
  --c-neto: #2d6a2d; --c-neto-bg: #e9f4ec; --loss: #b45309;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.doc { max-width: 940px; margin: 0 auto; padding: 28px 20px 56px; }

/* Encabezado corporativo */
.head { background: var(--brand); color: #fff; border-radius: 12px 12px 0 0; padding: 22px 26px; display: flex; align-items: center; gap: 18px; }
.head img { width: 58px; height: 58px; border-radius: 8px; display: block; box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.head .emp { flex: 1; }
.head .emp b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.head .emp span { color: #c9ccca; font-size: 13.5px; }
.head .per { text-align: right; }
.head .per b { display: block; font-size: 20px; font-weight: 600; }
.head .per span { color: #c9ccca; font-size: 13.5px; }
.subhead { background: var(--surface); border: 1px solid var(--rule); border-top: none; border-radius: 0 0 12px 12px; padding: 18px 26px; margin-bottom: 18px; }
.subhead p { margin: 0; font-size: 15.5px; max-width: 78ch; }
.subhead p strong { font-weight: 600; }
.acciones { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
.acciones button { font: inherit; font-size: 13px; font-weight: 500; background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 13px; cursor: pointer; }
.acciones button:hover { border-color: var(--muted); }
.acciones button:focus-visible { outline: 2px solid var(--c-neto); outline-offset: 2px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; background: #fff3d6; color: #7a5200; border-radius: 6px; padding: 3px 9px; margin-right: auto; align-self: center; }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; border-top: 3px solid var(--c-cargas); }
.kpi.bruta { border-top-color: var(--c-personal); }
.kpi.marg { border-top-color: var(--c-imp); }
.kpi.neto { border-top-color: var(--c-neto); background: var(--c-neto-bg); }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 21px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.01em; }
.kpi .s { font-size: 12.5px; color: var(--muted); }

/* Paneles */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
.grid2 .panel { margin-bottom: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.panel .desc { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
.chart { position: relative; height: 260px; }
.chart.alto { height: auto; }
.torta { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr); gap: 14px; align-items: center; }
.torta .chart { height: 180px; }
.leg { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.leg li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.leg li:last-child { border-bottom: none; }
.leg i { width: 12px; height: 12px; border-radius: 3px; display: block; transform: translateY(1px); }
.leg .m { text-align: right; white-space: nowrap; }
.leg .m small { display: block; color: var(--muted); font-size: 12px; }
.leg li.tot { font-weight: 600; }

/* Tablas */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #f7f8f7; }
th:first-child, td:first-child { text-align: left; }
td small { display: block; color: var(--muted); font-size: 11.5px; }
tfoot td { font-weight: 700; border-top: 2px solid var(--brand); border-bottom: none; }
.eerr td:first-child { white-space: normal; }
.eerr tr.menos td { color: var(--muted); }
.eerr tr.menos td:first-child { padding-left: 26px; }
.eerr tr.sub td { font-weight: 600; border-top: 1px solid #b9bfbb; }
.eerr tr.final td { background: var(--brand); color: #fff; font-weight: 700; font-size: 14.5px; border: none; }
.neg { color: var(--loss) !important; }
.aviso { background: #fff8e8; border: 1px solid #efdcaa; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }

.notas { font-size: 12.5px; color: var(--muted); }
.notas p { margin: 0 0 7px; max-width: 90ch; }
.notas strong { color: var(--ink); font-weight: 600; }
.pie { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
.pie img { width: 26px; height: 26px; border-radius: 5px; }
.estado { padding: 80px 20px; text-align: center; color: var(--muted); }

@media screen and (max-width: 760px) {
  .head { flex-wrap: wrap; padding: 18px; }
  .head .per { text-align: left; width: 100%; }
  .subhead { padding: 16px 18px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .grid2 { grid-template-columns: 1fr; }
  .torta { grid-template-columns: 1fr; }
  .torta .chart { height: 200px; max-width: 220px; margin: 0 auto; width: 100%; }
}
@page { size: A4; margin: 12mm; }
@media print {
  body { background: #fff; font-size: 12.5px; }
  .doc { max-width: none; padding: 0; }
  .acciones { display: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .panel, .kpi, .grid2, tr { break-inside: avoid; }
  .tw { overflow: visible; }
  th, td { padding: 6px 7px; font-size: 11px; }
  td small { font-size: 10px; }
  .kpi .v { font-size: 18px; }
  .chart { height: 230px; }
  .torta { grid-template-columns: 1fr; gap: 8px; }
  .torta .chart { height: 140px; max-width: 160px; margin: 0 auto; width: 100%; }
  .leg { font-size: 11px; }
  .leg li { padding: 3px 0; }
  .leg .m small { font-size: 10px; }
  .chart canvas { max-width: 100% !important; }
}
</style>
</head>

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const C = { personal: '#3f4a45', cargas: '#8a968f', imp: '#cbb57f', fijo: '#a9b3ae', iigg: '#a3843a', neto: '#2d6a2d', loss: '#b45309', rule: '#e2e5e3', muted: '#69726d' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Math.round(n || 0));
const corto = n => { const a = Math.abs(n); const s = n < 0 ? '−' : '';
  return a >= 1e6 ? `${s}$ ${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 })} M` : a >= 1e3 ? `${s}$ ${Math.round(a / 1e3)} mil` : `${s}$ ${Math.round(a)}`; };
const p1 = (a, b) => b ? (a / b * 100).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—';
const fecha = iso => { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
const pctTxt = n => String(n).replace('.', ',') + '%';
function estado(msg) { $('app').innerHTML = `<div class="estado">${esc(msg)}</div>`; }

function render(d, esPreview) {
  if (d.v !== 2) return estado('Este informe se generó con una versión anterior. Pedile a quien lo envió que lo vuelva a publicar.');
  const T = d.totales, E = d.estructura || {};
  const [y, m] = String(d.periodo).split('-');
  const periodoTxt = d.tipo === 'mes' ? `${MESES[+m - 1]} de ${y}` : `el año ${d.periodo}`;
  document.title = `${d.titulo} · SBS`;

  const partes = [
    { k: 'personal', t: 'Liquidaciones al personal', v: T.personal, c: C.personal },
    { k: 'cargas', t: 'Cargas sociales', v: T.totCargas, c: C.cargas },
    { k: 'imp', t: 'Impuestos sobre ventas', v: T.totImp, c: C.imp },
    { k: 'fijo', t: 'Costos fijos', v: T.fijos, c: C.fijo },
    { k: 'iigg', t: 'Impuesto a las Ganancias', v: T.iigg.monto, c: C.iigg },
  ].filter(x => x.v > 0);
  if (T.neto > 0) partes.push({ k: 'neto', t: 'Resultado neto', v: T.neto, c: C.neto });

  const resumen = T.neto >= 0
    ? `En ${periodoTxt}, el Movistar Arena generó ventas por <strong>${money(T.ventas)}</strong> (sin IVA) en ${T.shows} show${T.shows !== 1 ? 's' : ''}, con un <strong>resultado neto de ${money(T.neto)}</strong>, equivalente al ${p1(T.neto, T.ventas)} de las ventas.`
    : `En ${periodoTxt}, el Movistar Arena generó ventas por <strong>${money(T.ventas)}</strong> (sin IVA) en ${T.shows} show${T.shows !== 1 ? 's' : ''}, con un <strong>resultado neto negativo de ${money(-T.neto)}</strong>.`;

  const avisos = [];
  if (d.hayEstimados) avisos.push('Algunos shows tienen el costo de personal estimado porque su quincena todavía no se cerró. El número final puede variar levemente.');
  if (d.pendientes?.length) avisos.push(d.pendientes.length > 1
    ? `No incluye ${d.pendientes.length} shows del período que todavía no se facturaron: ${d.pendientes.map(p => esc(p.nombre)).join(', ')}.`
    : `No incluye un show del período que todavía no se facturó: ${esc(d.pendientes[0].nombre)}.`);

  const kpi = (cls, l, v, s) => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v ${v < 0 ? 'neg' : ''}">${money(v)}</div><div class="s">${s}</div></div>`;

  const f = (lbl, v, tipo = '') => `<tr class="${tipo}"><td>${lbl}</td><td>${tipo === 'menos' && v ? '−' + money(v) : money(v)}</td><td>${p1(tipo === 'menos' ? -v : v, T.ventas)}</td></tr>`;
  const eerr = `<table class="eerr"><thead><tr><th>Concepto</th><th>Monto</th><th>% ventas</th></tr></thead><tbody>
    ${f('Ventas (sin IVA)', T.ventas, 'sub')}
    ${f('Liquidaciones al personal', T.personal, 'menos')}
    ${T.cargas.map(c => f(`${esc(c.nombre)} (${pctTxt(c.pct)} de la liquidación)`, c.monto, 'menos')).join('')}
    ${f('Utilidad bruta', T.utBruta, 'sub')}
    ${T.impuestos.map(c => f(`${esc(c.nombre)} (${pctTxt(c.pct)} de las ventas)`, c.monto, 'menos')).join('')}
    ${f('Contribución marginal', T.contrMarginal, 'sub')}
    ${T.fijos ? f('Costos fijos', T.fijos, 'menos') + f('EBIT', T.ebit, 'sub') : ''}
    ${f(`Impuesto a las Ganancias (${pctTxt(T.iigg.pct)})`, T.iigg.monto, 'menos')}
    ${f('Resultado neto', T.neto, 'final')}
  </tbody></table>`;

  const detalle = `<table><thead><tr><th>Show</th><th>Staff</th><th>Ventas</th><th>Personal y cargas</th><th>Impuestos</th><th>Resultado neto</th><th>Margen</th></tr></thead>
    <tbody>${d.shows.map(s => `<tr><td>${esc(s.nombre)}<small>${fecha(s.fecha)}${s.estimado ? ', costo estimado' : ''}</small></td><td>${s.staff || '—'}</td><td>${money(s.ventas)}</td><td>${money(s.personal + s.cargas)}</td><td>${money(s.impuestos + s.iigg)}</td><td class="${s.neto < 0 ? 'neg' : ''}">${money(s.neto)}</td><td>${p1(s.neto, s.ventas)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${T.staff || '—'}</td><td>${money(T.ventas)}</td><td>${money(T.personal + T.totCargas)}</td><td>${money(T.totImp + T.iigg.monto)}</td><td class="${T.neto < 0 ? 'neg' : ''}">${money(T.neto)}</td><td>${p1(T.neto, T.ventas)}</td></tr></tfoot></table>`;

  const altoShows = Math.max(170, d.shows.length * 46 + 70);
  $('app').innerHTML = `
    <div class="acciones">
      ${esPreview ? '<span class="tag">Vista previa, todavía no publicada</span>' : ''}
      <button onclick="window.print()">Imprimir / guardar PDF</button>
    </div>
    <header class="head">
      <img src="${LOGO}" alt="SBS">
      <div class="emp"><b>Show Business Solutions</b><span>Informe de resultados, Movistar Arena</span></div>
      <div class="per"><b>${esc(d.periodoLabel)}</b><span>${d.tipo === 'mes' ? 'Informe mensual' : 'Informe anual'}</span></div>
    </header>
    <div class="subhead"><p>${resumen}</p></div>
    ${avisos.map(a => `<div class="aviso">${a}</div>`).join('')}
    <section class="kpis">
      ${kpi('', 'Ventas (sin IVA)', T.ventas, `${T.shows} show${T.shows !== 1 ? 's' : ''}, ${T.staff} puestos`)}
      ${kpi('bruta', 'Utilidad bruta', T.utBruta, `${p1(T.utBruta, T.ventas)} de las ventas`)}
      ${kpi('marg', 'Contribución marginal', T.contrMarginal, `${p1(T.contrMarginal, T.ventas)} de las ventas`)}
      ${kpi('neto', 'Resultado neto', T.neto, `${p1(T.neto, T.ventas)} de las ventas`)}
    </section>
    <div class="grid2">
      <section class="panel">
        <h2>Distribución de las ventas</h2>
        <p class="desc">A dónde fue cada peso vendido.</p>
        <div class="torta">
          <div class="chart"><canvas id="gTorta" aria-label="Distribución de las ventas" role="img"></canvas></div>
          <ul class="leg">${partes.map(x => `<li><i style="background:${x.c}"></i><span>${x.t}</span><span class="m">${money(x.v)}<small>${p1(x.v, T.ventas)}</small></span></li>`).join('')}</ul>
        </div>
      </section>
      <section class="panel">
        <h2>Cascada de resultados</h2>
        <p class="desc">De las ventas al resultado neto, paso a paso.</p>
        <div class="chart"><canvas id="gCascada" aria-label="Cascada de resultados" role="img"></canvas></div>
      </section>
    </div>
    ${d.meses ? `<section class="panel"><h2>Evolución mensual</h2><p class="desc">Ventas y resultado neto de cada mes.</p><div class="chart"><canvas id="gMeses" aria-label="Evolución mensual" role="img"></canvas></div></section>` : ''}
    <section class="panel">
      <h2>Resultado por show</h2>
      <p class="desc">Cómo se reparten las ventas de cada show entre costos, impuestos y resultado.</p>
      <div class="chart" style="height:${altoShows}px"><canvas id="gShows" aria-label="Resultado por show" role="img"></canvas></div>
    </section>
    <section class="panel"><h2>Estado de resultados</h2><p class="desc">Cada renglón se descuenta del anterior.</p><div class="tw">${eerr}</div></section>
    <section class="panel"><h2>Detalle por show</h2><p class="desc">Montos en pesos, sin IVA. "Impuestos" incluye los impuestos sobre ventas y Ganancias.</p><div class="tw">${detalle}</div></section>
    <section class="notas">
      <p><strong>Ventas:</strong> lo que SBS le factura al Movistar Arena por el staff de cada show, sin IVA.</p>
      <p><strong>Utilidad bruta:</strong> ventas menos lo liquidado a los colaboradores y ${T.cargas.map(c => `${esc(c.nombre.toLowerCase())} (${pctTxt(c.pct)} de la liquidación)`).join(' y ') || 'las cargas'}.</p>
      <p><strong>Contribución marginal:</strong> descuenta los impuestos sobre ventas (${T.impuestos.map(c => `${esc(c.nombre)} ${pctTxt(c.pct)}`).join(', ')}).</p>
      ${T.fijos ? `<p><strong>EBIT:</strong> descuenta los costos fijos del Arena (${money(E.fijosMes)} por mes), repartidos entre los shows según lo vendido.</p>` : ''}
      <p><strong>Resultado neto:</strong> descuenta el Impuesto a las Ganancias estimado (${pctTxt(T.iigg.pct)}). Ganancias se liquida una vez por año sobre el resultado de toda la empresa; acá se estima para mostrar lo que queda después de impuestos.</p>
      <p>Los datos arrancan con el show del ${fecha(d.desde)}, primer show con facturación registrada.</p>
    </section>
    <footer class="pie"><img src="${LOGO}" alt=""><span>Show Business Solutions. Documento confidencial para uso de los socios. Generado el ${new Date(d.generado).toLocaleDateString('es-AR')}.</span></footer>`;

  graficos(d, partes);
}

const CHARTS = [];
function reajustarGraficos() { CHARTS.forEach(c => { try { c.resize(); } catch {} }); }
window.addEventListener('beforeprint', reajustarGraficos);
window.addEventListener('afterprint', reajustarGraficos);
if (window.matchMedia) window.matchMedia('print').addEventListener?.('change', reajustarGraficos);

function graficos(d, partes) {
  if (typeof Chart === 'undefined') return;
  const _Chart = Chart;
  const nuevo = (el, cfg) => { const c = new _Chart(el, cfg); CHARTS.push(c); return c; };
  const T = d.totales;
  Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = C.muted;
  Chart.defaults.animation = false;
  Chart.defaults.devicePixelRatio = Math.max(2, window.devicePixelRatio || 1);
  const ejeMoneda = { ticks: { callback: v => corto(v) }, grid: { color: C.rule }, border: { display: false } };
  const tip = { callbacks: { label: c => ` ${c.dataset.label || c.label}: ${money(Array.isArray(c.raw) ? c.raw[1] - c.raw[0] : c.raw)}` } };

  // Torta: distribución de las ventas
  nuevo($('gTorta'), {
    type: 'doughnut',
    data: { labels: partes.map(x => x.t), datasets: [{ data: partes.map(x => x.v), backgroundColor: partes.map(x => x.c), borderColor: '#fff', borderWidth: 2 }] },
    options: { maintainAspectRatio: false, cutout: '58%', plugins: { legend: { display: false },
      tooltip: { callbacks: { label: c => ` ${c.label}: ${money(c.raw)} (${p1(c.raw, T.ventas)})` } } } },
  });

  // Cascada: barras flotantes de las ventas al resultado neto
  const pasos = [];
  let acc = T.ventas;
  pasos.push({ l: 'Ventas', r: [0, T.ventas], c: '#5b6661' });
  const bajar = (l, v, c) => { if (!v) return; pasos.push({ l, r: [acc - v, acc], c }); acc -= v; };
  bajar('Personal', T.personal, C.personal);
  bajar('Cargas sociales', T.totCargas, C.cargas);
  bajar('Imp. s/ ventas', T.totImp, C.imp);
  bajar('Costos fijos', T.fijos, C.fijo);
  bajar('Ganancias', T.iigg.monto, C.iigg);
  pasos.push({ l: 'Resultado neto', r: [0, T.neto], c: T.neto >= 0 ? C.neto : C.loss });
  nuevo($('gCascada'), {
    type: 'bar',
    data: { labels: pasos.map(x => x.l), datasets: [{ label: 'Monto', data: pasos.map(x => x.r), backgroundColor: pasos.map(x => x.c), borderRadius: 3, maxBarThickness: 26 }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tip },
      scales: { x: { ...ejeMoneda, ticks: { callback: v => corto(v), maxTicksLimit: 5 } }, y: { grid: { display: false }, border: { display: false }, ticks: { color: '#1f2421' } } } },
  });

  // Resultado por show: barras horizontales apiladas
  const ds = (label, key, color) => ({ label, data: d.shows.map(s => typeof key === 'function' ? key(s) : s[key]), backgroundColor: color, borderRadius: 2, maxBarThickness: 26 });
  const sets = [
    ds('Personal y cargas', s => s.personal + s.cargas, C.personal),
    ds('Impuestos sobre ventas', 'impuestos', C.imp),
    d.totales.fijos ? ds('Costos fijos', 'fijos', C.fijo) : null,
    ds('Ganancias', 'iigg', C.iigg),
    ds('Resultado neto', 'neto', C.neto),
  ].filter(Boolean);
  nuevo($('gShows'), {
    type: 'bar',
    data: { labels: d.shows.map(s => `${s.nombre}  ${fecha(s.fecha).slice(0, 5)}`), datasets: sets },
    options: { indexAxis: 'y', maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, padding: 14 } }, tooltip: tip },
      scales: { x: { ...ejeMoneda, stacked: true }, y: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: '#1f2421' } } } },
  });

  // Anual: evolución mensual (barras de ventas + línea de resultado neto)
  if (d.meses && $('gMeses')) {
    nuevo($('gMeses'), {
      data: { labels: d.meses.map(x => x.label.split(' ')[0]),
        datasets: [
          { type: 'bar', label: 'Ventas', data: d.meses.map(x => x.ventas), backgroundColor: '#c9cfcb', borderRadius: 3, maxBarThickness: 48, order: 2 },
          { type: 'line', label: 'Resultado neto', data: d.meses.map(x => x.neto), borderColor: C.neto, backgroundColor: C.neto, borderWidth: 2.5, pointRadius: 4, tension: .25, order: 1 },
        ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12 } }, tooltip: tip },
        scales: { y: ejeMoneda, x: { grid: { display: false }, border: { display: false } } } },
    });
  }
}

(async function () {
  const params = new URLSearchParams(location.search);
  if (params.get('preview')) {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('sbs_informe_preview') || 'null'); } catch {}
    return d ? render(d, true) : estado('No hay una vista previa para mostrar. Generala desde la app.');
  }
  const t = params.get('t');
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) return estado('El link del informe no es válido.');
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_informe', { p_token: t });
    if (error || !data) return estado('No encontramos este informe. Puede que el link esté incompleto o que el informe se haya borrado.');
    render(data.data, false);
  } catch (e) {
    estado('No se pudo cargar el informe. Probá de nuevo en un momento.');
  }
})();
</script>
</body>
</html>
