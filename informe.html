<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informe Movistar Arena · SBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --ink: #16261d; --muted: #5e6e65; --rule: #dde4df;
  --paper: #f5f7f5; --surface: #ffffff;
  --green: #2d6a2d; --mint: #a8e4bc;
  --cost: #b3c0b8; --desc: #d9c894; --fijo: #8fa39a; --iigg: #b9a060; --loss: #b45309;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px; line-height: 1.55; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 22px 64px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 40px; }
.marca { font-weight: 800; letter-spacing: -0.01em; font-size: 15px; }
.marca span { font-weight: 500; color: var(--muted); }
button.print {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent;
  border: 1px solid var(--rule); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
button.print:hover { border-color: var(--muted); }
button.print:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.periodo { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
h1 {
  font-size: clamp(30px, 6vw, 46px); line-height: 1.12; letter-spacing: -0.025em;
  font-weight: 800; margin: 0 0 16px; max-width: 24ch;
}
.bajada { font-size: 18px; color: var(--muted); margin: 0 0 34px; max-width: 58ch; }
.bajada strong { color: var(--ink); font-weight: 600; }

/* La barra "a dónde fue cada peso facturado" */
.barra { position: relative; display: flex; height: 64px; border-radius: 10px; overflow: hidden; background: var(--rule); }
.barra .marca-fact { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); }
.seg { height: 100%; }
.seg.costo { background: var(--cost); }
.seg.desc { background: var(--desc); }
.seg.gan { background: var(--green); }
.seg.fijo { background: #8fa39a; }
.seg.iigg { background: #b9a060; }
.leyenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 14px; margin: 14px 0 52px; }
.ley { border-top: 3px solid var(--cost); padding-top: 8px; }
.ley.desc { border-color: var(--desc); }
.ley.fijo { border-color: var(--fijo); }
.ley.iigg { border-color: var(--iigg); }
.ley.gan { border-color: var(--green); }
.ley.perd { border-color: var(--loss); }
.ley .n { font-weight: 600; font-size: 17px; }
.ley .t { color: var(--muted); font-size: 13px; }

h2 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 6px; font-weight: 800; }
.nota-h2 { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

.filas { margin-bottom: 52px; }
.fila { display: grid; grid-template-columns: 170px 1fr 165px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.fila:first-child { border-top: 1px solid var(--rule); }
.fila .nom { font-weight: 600; font-size: 15px; line-height: 1.3; }
.fila .nom small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.fila .mini { position: relative; display: flex; height: 18px; border-radius: 5px; overflow: hidden; }
.fila .marca-fact { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.fila .res { text-align: right; font-weight: 600; font-size: 15px; line-height: 1.3; }
.fila .res small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.neg { color: var(--loss); }

.tabla-wrap { overflow-x: auto; margin-bottom: 52px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
th, td { padding: 10px 11px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 13px; }
th:first-child, td:first-child { text-align: left; }
tfoot td { font-weight: 800; border-bottom: none; }
table.eerr { min-width: 0; }
table.eerr td:first-child { white-space: normal; }
table.eerr tr.menos td { color: var(--muted); }
table.eerr tr.menos td:first-child { padding-left: 28px; }
table.eerr tr.total td { font-weight: 800; border-top: 1px solid var(--ink); }
table.eerr tr.total:first-child td { border-top: none; }
table.eerr tr.final td { background: #eaf6ee; font-size: 16px; border-bottom: none; }
table.eerr { margin: 0; }
td small.f { display: block; color: var(--muted); font-size: 12px; }

.metodo { font-size: 14px; color: var(--muted); max-width: 64ch; }
.metodo p { margin: 0 0 10px; }
.metodo strong { color: var(--ink); font-weight: 600; }
.aviso { background: #fff7e6; border: 1px solid #efd9a6; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 0 0 28px; }
.pie { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12.5px; }
.estado { padding: 80px 0; color: var(--muted); }

@media (max-width: 600px) {
  .wrap { padding-top: 22px; }
  .top { margin-bottom: 28px; }
  .bajada { font-size: 16px; }
  .barra { height: 48px; }
  .leyenda { grid-template-columns: 1fr; gap: 10px; }
  .fila { grid-template-columns: 1fr auto; row-gap: 8px; }
  .fila .mini { grid-column: 1 / -1; grid-row: 2; }
}
@media print {
  body { background: #fff; }
  button.print, .preview-tag { display: none; }
  .wrap { padding-top: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fila, tr { break-inside: avoid; }
}
.preview-tag { display: inline-block; background: var(--mint); color: var(--ink); font-size: 12px; font-weight: 600; border-radius: 6px; padding: 3px 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="estado">Cargando informe…</div></main>

<script>
const SUPABASE_URL = 'https://tvggknkvrjsuhnfahtzl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2Z2drbmt2cmpzdWhuZmFodHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MDg2MzMsImV4cCI6MjA5NzI4NDYzM30.GjZl4U-VDXzLw21-eMOT3FZUgIdAL_am25z4w_fW6oE';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Math.round(n || 0));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fecha = iso => { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };

function estado(msg) { $('app').innerHTML = `<div class="estado">${esc(msg)}</div>`; }
const p1 = (a, b) => b ? (a / b * 100).toFixed(1).replace('.', ',') + '%' : '—';

// Partes en que se va cada peso vendido, en orden de la cascada.
function partes(r) {
  return [
    { cls: 'costo', v: (r.personal || 0) + (r.cargas || 0), t: 'Personal y cargas sociales' },
    { cls: 'desc',  v: r.impuestos || 0, t: 'Impuestos sobre ventas' },
    { cls: 'fijo',  v: r.fijos || 0, t: 'Costos fijos' },
    { cls: 'iigg',  v: r.iigg || 0, t: 'Impuesto a las Ganancias' },
  ];
}
// Barra partida escalada contra "escala". Si hay pérdida, los costos pasan la marca de lo vendido.
function barra(r, escala, clase) {
  const w = v => Math.max(0, v) / (escala || 1) * 100;
  const segs = partes(r).filter(x => x.v > 0).map(x => `<div class="seg ${x.cls}" style="width:${w(x.v)}%"></div>`).join('');
  const neto = r.neto > 0 ? `<div class="seg gan" style="width:${w(r.neto)}%"></div>` : '';
  const marca = r.neto < 0 ? `<div class="marca-fact" style="left:${w(r.ventas)}%" title="Ventas"></div>` : '';
  return `<div class="${clase}">${segs}${neto}${marca}</div>`;
}

function filas(items, etiqueta, sub) {
  const escala = Math.max(...items.map(r => Math.max(r.ventas, partes(r).reduce((s, x) => s + x.v, 0))), 1);
  return `<div class="filas">${items.map(r => `<div class="fila">
      <div class="nom">${esc(etiqueta(r))}<small>${esc(sub(r))}</small></div>
      <div role="img" aria-label="${esc(etiqueta(r))}: ventas ${money(r.ventas)}, resultado neto ${money(r.neto)}">${barra(r, escala, 'mini')}</div>
      <div class="res ${r.neto < 0 ? 'neg' : ''}">${money(r.neto)}<small>${p1(r.neto, r.ventas)} de ${money(r.ventas)}</small></div>
    </div>`).join('')}</div>`;
}

function render(d, esPreview) {
  if (d.v !== 2) return estado('Este informe se generó con una versión anterior. Pedile a quien lo envió que lo vuelva a publicar.');
  const T = d.totales, E = d.estructura || {};
  const [y, m] = String(d.periodo).split('-');
  const cuando = d.tipo === 'mes' ? `En ${MESES[+m - 1]} de ${y}` : `En ${d.periodo}`;
  document.title = `${d.titulo} · SBS`;
  const pctTxt = n => String(n).replace('.', ',') + '%';

  const h1 = T.neto >= 0
    ? `${cuando}, el Movistar Arena dejó ${money(T.neto)} de resultado neto.`
    : `${cuando}, el Movistar Arena tuvo un resultado negativo de ${money(-T.neto)}.`;
  const bajada = `Sobre <strong>${money(T.ventas)}</strong> vendidos sin IVA en ${T.shows} show${T.shows !== 1 ? 's' : ''}`
    + (T.neto >= 0 ? `: de cada 100 pesos, <strong>${Math.round(T.neto / T.ventas * 100)}</strong> quedaron en la empresa después de pagar al personal, las cargas sociales y los impuestos.` : '.');

  const tot = { ventas: T.ventas, personal: T.personal, cargas: T.totCargas, impuestos: T.totImp, fijos: T.fijos, iigg: T.iigg.monto, neto: T.neto };
  const escala = Math.max(T.ventas, partes(tot).reduce((s, x) => s + x.v, 0), 1);
  const leyenda = partes(tot).filter(x => x.v > 0).map(x => `<div class="ley ${x.cls}"><div class="n">${money(x.v)}</div><div class="t">${x.t}, ${p1(x.v, T.ventas)}</div></div>`).join('')
    + `<div class="ley ${T.neto >= 0 ? 'gan' : 'perd'}"><div class="n">${money(T.neto)}</div><div class="t">Resultado neto, ${p1(T.neto, T.ventas)}</div></div>`;

  // Estado de resultados, con la misma cascada que la planilla de referencia
  const fila = (lbl, v, tipo) => `<tr class="${tipo}"><td>${lbl}</td><td>${tipo === 'menos' && v ? '−' + money(v) : money(v)}</td><td>${p1(tipo === 'menos' ? -v : v, T.ventas)}</td></tr>`;
  const eerr = `<div class="tabla-wrap"><table class="eerr">
    <thead><tr><th>Concepto</th><th>Monto</th><th>% ventas</th></tr></thead><tbody>
    ${fila('Ventas (sin IVA)', T.ventas, 'total')}
    ${fila('Liquidaciones al personal', T.personal, 'menos')}
    ${T.cargas.map(c => fila(`${esc(c.nombre)}, ${pctTxt(c.pct)} de la liquidación`, c.monto, 'menos')).join('')}
    ${fila('Utilidad bruta', T.utBruta, 'total')}
    ${T.impuestos.map(c => fila(`${esc(c.nombre)}, ${pctTxt(c.pct)} de las ventas`, c.monto, 'menos')).join('')}
    ${fila('Contribución marginal', T.contrMarginal, 'total')}
    ${T.fijos ? fila('Costos fijos', T.fijos, 'menos') : ''}
    ${T.fijos ? fila('EBIT', T.ebit, 'total') : ''}
    ${fila(`Impuesto a las Ganancias, ${pctTxt(T.iigg.pct)} del ${T.fijos ? 'EBIT' : 'resultado antes de impuestos'}`, T.iigg.monto, 'menos')}
    ${fila('Resultado neto', T.neto, 'total final')}
    </tbody></table></div>`;

  const porShow = filas(d.shows, r => r.nombre, r => `${fecha(r.fecha)}${r.staff ? `, ${r.staff} puestos` : ''}${r.estimado ? ', costo estimado' : ''}`);
  const porMes = d.meses ? filas(d.meses, r => r.label, r => `${r.shows} show${r.shows !== 1 ? 's' : ''}`) : '';

  const detalle = `<div class="tabla-wrap"><table>
    <thead><tr><th>Show</th><th>Ventas</th><th>Personal y cargas</th><th>Impuestos</th><th>Resultado neto</th><th>%</th></tr></thead>
    <tbody>${d.shows.map(s => `<tr><td>${esc(s.nombre)}<small class="f">${fecha(s.fecha)}</small></td><td>${money(s.ventas)}</td><td>${money(s.personal + s.cargas)}</td><td>${money(s.impuestos + s.iigg)}</td><td class="${s.neto < 0 ? 'neg' : ''}">${money(s.neto)}</td><td>${p1(s.neto, s.ventas)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td>${money(T.ventas)}</td><td>${money(T.personal + T.totCargas)}</td><td>${money(T.totImp + T.iigg.monto)}</td><td class="${T.neto < 0 ? 'neg' : ''}">${money(T.neto)}</td><td>${p1(T.neto, T.ventas)}</td></tr></tfoot>
  </table></div>`;

  const avisos = [];
  if (d.hayEstimados) avisos.push('Algunos shows tienen el costo de personal estimado porque su quincena todavía no se cerró. El número final puede variar levemente.');
  if (d.pendientes?.length) avisos.push(d.pendientes.length > 1
    ? `No incluye ${d.pendientes.length} shows del período que todavía no se facturaron: ${d.pendientes.map(p => esc(p.nombre)).join(', ')}.`
    : `No incluye un show del período que todavía no se facturó: ${esc(d.pendientes[0].nombre)}.`);

  const listaImp = T.impuestos.map(c => `${esc(c.nombre)} ${pctTxt(c.pct)}`).join(', ');
  $('app').innerHTML = `
    <div class="top">
      <div class="marca">SBS <span>Show Business Solutions</span></div>
      <button class="print" onclick="window.print()">Imprimir / PDF</button>
    </div>
    ${esPreview ? '<div class="preview-tag">Vista previa, todavía no publicada</div>' : ''}
    <p class="periodo">Informe de resultados, Movistar Arena, ${esc(d.periodoLabel.toLowerCase())}</p>
    <h1>${h1}</h1>
    <p class="bajada">${bajada}</p>
    <div role="img" aria-label="A dónde fue cada peso vendido">${barra(tot, escala, 'barra')}</div>
    <div class="leyenda">${leyenda}</div>
    ${avisos.map(a => `<div class="aviso">${a}</div>`).join('')}
    <h2>Estado de resultados</h2>
    <p class="nota-h2">Cada renglón se descuenta del anterior, de las ventas al resultado neto.</p>
    ${eerr}
    ${d.meses ? `<h2>Mes por mes</h2><p class="nota-h2">El largo de cada barra son las ventas del mes; el verde es el resultado neto.</p>${porMes}` : ''}
    <h2>Show por show</h2>
    <p class="nota-h2">El largo de cada barra son las ventas del show; el verde es lo que quedó al final de la cascada.</p>
    ${porShow}
    <h2>Detalle</h2>
    <p class="nota-h2">Montos en pesos, sin IVA. "Impuestos" incluye los impuestos sobre ventas y Ganancias.</p>
    ${detalle}
    <h2>Cómo se calcula</h2>
    <div class="metodo">
      <p><strong>Ventas</strong> es lo que SBS le factura al Movistar Arena por el staff de cada show, sin IVA.</p>
      <p><strong>Utilidad bruta</strong> descuenta lo liquidado a los colaboradores y ${T.cargas.map(c => `${esc(c.nombre.toLowerCase())} (${pctTxt(c.pct)} de la liquidación)`).join(' y ') || 'las cargas'}.</p>
      <p><strong>Contribución marginal</strong> descuenta los impuestos sobre ventas: ${listaImp}.</p>
      ${T.fijos ? `<p><strong>EBIT</strong> descuenta los costos fijos del Arena (${money(E.fijosMes)} por mes), repartidos entre los shows según lo vendido.</p>` : ''}
      <p><strong>Resultado neto</strong> descuenta el Impuesto a las Ganancias estimado (${pctTxt(T.iigg.pct)}). Ganancias se liquida una vez por año sobre el resultado de toda la empresa; acá se estima para mostrar lo que queda después de impuestos.</p>
      <p>Los números arrancan con el show del ${fecha(d.desde)}, primer show con facturación registrada.</p>
    </div>
    <div class="pie">Generado el ${new Date(d.generado).toLocaleDateString('es-AR')}. Documento para uso interno de los socios de SBS.</div>`;
}

(async function () {
  const params = new URLSearchParams(location.search);
  if (params.get('preview')) {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('sbs_informe_preview') || 'null'); } catch {}
    return d ? render(d, true) : estado('No hay una vista previa para mostrar. Generala desde la app.');
  }
  const t = params.get('t');
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) return estado('El link del informe no es válido.');
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_informe', { p_token: t });
    if (error || !data) return estado('No encontramos este informe. Puede que el link esté incompleto o que el informe se haya borrado.');
    render(data.data, false);
  } catch (e) {
    estado('No se pudo cargar el informe. Probá de nuevo en un momento.');
  }
})();
</script>
</body>
</html>
