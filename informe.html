<style>
:root {
  --brand: #2b2b2b; --ink: #1f2421; --muted: #69726d; --rule: #e2e5e3;
  --bg: #f2f3f2; --surface: #ffffff;
  --c-personal: #3f4a45; --c-cargas: #8a968f; --c-imp: #cbb57f; --c-fijo: #a9b3ae; --c-iigg: #a3843a;
  --c-neto: #2d6a2d; --c-neto-bg: #e9f4ec; --loss: #b45309; --c-ing: #2b2b2b; --c-egr: #9a958c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.doc { max-width: 940px; margin: 0 auto; padding: 28px 20px 56px; }

/* Encabezado corporativo */
.head { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-bottom: 3px solid var(--brand); border-radius: 12px 12px 0 0; padding: 22px 26px; display: flex; align-items: center; gap: 18px; }
.head img { width: 60px; height: 60px; border-radius: 8px; display: block; }
.head .emp { flex: 1; }
.head .emp b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.head .emp span { color: var(--muted); font-size: 13.5px; }
.head .per { text-align: right; }
.head .per b { display: block; font-size: 20px; font-weight: 600; }
.head .per span { color: var(--muted); font-size: 13.5px; }
.subhead { background: var(--surface); border: 1px solid var(--rule); border-top: none; border-radius: 0 0 12px 12px; padding: 18px 26px; margin-bottom: 18px; }
.subhead p { margin: 0; font-size: 15.5px; max-width: 78ch; }
.subhead p strong { font-weight: 600; }
.acciones { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
.acciones button { font: inherit; font-size: 13px; font-weight: 500; background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 13px; cursor: pointer; }
.acciones button:hover { border-color: var(--muted); }
.acciones button:focus-visible { outline: 2px solid var(--c-neto); outline-offset: 2px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; background: #fff3d6; color: #7a5200; border-radius: 6px; padding: 3px 9px; margin-right: auto; align-self: center; }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; border-top: 3px solid var(--c-cargas); }
.kpi.ing { border-top-color: var(--c-ing); }
.kpi.egr { border-top-color: var(--c-egr); }
.kpi.mar { border-top-color: var(--c-neto); }
.kpi.neto { border-top-color: var(--c-neto); background: var(--c-neto-bg); }

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const C = { personal: '#3f4a45', cargas: '#8a968f', imp: '#cbb57f', fijo: '#a9b3ae', iigg: '#a3843a', neto: '#2d6a2d', ing: '#2b2b2b', egr: '#9a958c', loss: '#b45309', rule: '#e2e5e3', muted: '#69726d' };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Math.round(n || 0));
const corto = n => { const a = Math.abs(n); const s = n < 0 ? '−' : '';
  return a >= 1e6 ? `${s}$ ${(a / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 })} M` : a >= 1e3 ? `${s}$ ${Math.round(a / 1e3)} mil` : `${s}$ ${Math.round(a)}`; };
const p1 = (a, b) => b ? (a / b * 100).toLocaleString('es-AR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—';
const fecha = iso => { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
const pctTxt = n => String(n).replace('.', ',') + '%';

// ══ Estado de la vista (filtro de mes, montos/%, orden de la tabla, show abierto) ══
const S = { d: null, preview: false, embed: new URLSearchParams(location.search).has('embed'), mes: null, modo: 'monto', orden: { col: 'neto', dir: -1 }, abierto: null, fuentes: false };
const egr = s => s.ventas - s.neto;

function render(d, esPreview) {
  if (d.v !== 2) return estado('Este informe se generó con una versión anterior. Pedile a quien lo envió que lo vuelva a publicar.');
  d.shows.forEach((s, i) => s._i = i);
  S.d = d; S.preview = esPreview;
  document.title = `${d.titulo} · SBS`;
  document.addEventListener('keydown', teclas);
  dibujar();
}

function showsVisibles() { return S.mes ? S.d.shows.filter(s => s.fecha.slice(0, 7) === S.mes) : S.d.shows; }
// Totales de un subconjunto de shows (mismas fórmulas lineales que la app)
function totalesDe(shows) {
  const E = S.d.estructura || {};
  const sum = k => shows.reduce((a, x) => a + (x[k] || 0), 0);
  const ventas = sum('ventas'), personal = sum('personal');
  const cargas = (E.cargas || []).filter(x => (x.nombre || '').trim()).map(x => ({ nombre: x.nombre.trim(), pct: +x.pct || 0, monto: Math.round(personal * (+x.pct || 0) / 100) }));
  const impuestos = (E.impuestos || []).filter(x => (x.nombre || '').trim()).map(x => ({ nombre: x.nombre.trim(), pct: +x.pct || 0, monto: Math.round(ventas * (+x.pct || 0) / 100) }));
  const totCargas = cargas.reduce((a, x) => a + x.monto, 0), totImp = impuestos.reduce((a, x) => a + x.monto, 0);

// ══ Interacciones ══
window.filtrarMes = function(p) { S.mes = p; S.abierto = null; dibujar(); };
window.cambiarModo = function() {};   // el informe se muestra siempre en montos (la vista en % se sacó)
window.ordenar = function(col) {
  S.orden = S.orden.col === col ? { col, dir: -S.orden.dir } : { col, dir: col === 'fecha' ? 1 : -1 };
  dibujar();
  document.querySelector(`th button.sort[onclick="ordenar('${col}')"]`)?.focus();
};
function teclas(e) {
  if (S.abierto == null && $('vov')?.style.display === 'flex') {
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); vPantallaCompleta(); return; }
    if (e.key === 'Escape') { if (V.tipFijo) { vSoltarTip(); return; } if (vEnPantalla()) { vSalirPantalla(); return; } cerrarVideo(); }
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); e.target?.blur?.(); vToggle(); }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault(); const k = vCapActual(), ini = vInicios();
      const dest = e.key === 'ArrowRight' ? k + 1 : (V.t - ini[k] > 1.5 ? k : k - 1);
      vIrCap(dest); if (vEnPantalla()) vAviso(V_CAP[V.escenas[vCapActual()].draw.name] || '', 1400);
    }
    return;
  }
  if (S.abierto == null) return;
  if (e.key === 'Escape') cerrarShow();
  if (e.key === 'ArrowRight') moverShow(1);
  if (e.key === 'ArrowLeft') moverShow(-1);
}
// Donde se abre el detalle de un show: en pantalla completa, dentro del reproductor (si no, no se vería)
function modalHost() {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs) { let m = fs.querySelector('#vmodal'); if (!m) { m = document.createElement('div'); m.id = 'vmodal'; fs.appendChild(m); } return m; }
  return $('modal');
}
window.cerrarShow = function() { S.abierto = null; ['modal', 'vmodal'].forEach(id => { const m = $(id); if (m) m.innerHTML = ''; }); };

  const imps = (E.impuestos || []).filter(x => (x.nombre || '').trim()).map(x => ({ n: x.nombre.trim(), p: +x.pct || 0, m: Math.round(s.ventas * (+x.pct || 0) / 100) }));

const fmtVal = v => S.modo === 'pct' ? nf1(v) + '%' : corto(v);
// Etiquetas: monto/% en el extremo de cada barra (o centrado si la barra está apilada) y % dentro de cada porción
const ETIQUETAS = {
  id: 'etiquetas',
  afterDatasetsDraw(chart) {
    const { ctx } = chart; ctx.save();
    ctx.font = "600 11px 'Poppins', system-ui, sans-serif";
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      if (meta.type === 'bar') {
        const horiz = chart.options.indexAxis === 'y';
        const apilado = horiz ? chart.options.scales?.x?.stacked : chart.options.scales?.y?.stacked;
        meta.data.forEach((el, i) => {
          const v = ds.data[i]; if (v == null) return;
          const txt = fmtVal(v);
          if (apilado) {
            const largo = horiz ? Math.abs(el.x - el.base) : Math.abs(el.base - el.y);
            if (largo < ctx.measureText(txt).width + 10) return;
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            horiz ? ctx.fillText(txt, (el.x + el.base) / 2, el.y) : ctx.fillText(txt, el.x, (el.y + el.base) / 2);
          } else {
            ctx.fillStyle = '#1f2421';
            if (horiz) { ctx.textAlign = v >= 0 ? 'left' : 'right'; ctx.textBaseline = 'middle'; ctx.fillText(txt, el.x + (v >= 0 ? 6 : -6), el.y); }
            else { ctx.textAlign = 'center'; ctx.textBaseline = v >= 0 ? 'bottom' : 'top'; ctx.fillText(txt, el.x, el.y + (v >= 0 ? -5 : 5)); }
          }
        });
      } else if (meta.type === 'doughnut') {
        const tot = ds.data.reduce((a, b) => a + b, 0);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        meta.data.forEach((el, i) => {
          const share = ds.data[i] / tot; if (share < 0.07) return;
          const p = el.tooltipPosition(); ctx.fillText(Math.round(share * 100) + '%', p.x, p.y);
        });
      }
    });
    ctx.restore();
  },
};

function graficos(T, shows, egresos) {
  CHARTS.splice(0).forEach(c => c.destroy());

  const _Chart = Chart;
  const nuevo = (el, cfg) => { if (!el) return; cfg.plugins = [...(cfg.plugins || []), ETIQUETAS]; const c = new _Chart(el, cfg); CHARTS.push(c); return c; };
  const pct = S.modo === 'pct', egresosTot = T.ventas - T.neto;
  Chart.defaults.font.family = "'Poppins', system-ui, sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = C.muted;
  Chart.defaults.animation = false;
  Chart.defaults.devicePixelRatio = Math.max(2, window.devicePixelRatio || 1);
  const eje = { ticks: { callback: v => pct ? v + '%' : corto(v), maxTicksLimit: 6 }, grid: { color: C.rule }, border: { display: false } };
  const sinGrilla = { grid: { display: false }, border: { display: false }, ticks: { color: '#1f2421', maxRotation: 0, autoSkip: false } };

  const colRes = v => v >= 0 ? C.neto : C.loss;
  // Las acciones se difieren un instante: si redibujan, no destruyen el gráfico mientras procesa su propio clic
  const clicShow = (evt, els) => { if (els.length) { const i = shows[els[0].index]._i; setTimeout(() => abrirShow(i), 0); } };
  const cursor = (evt, els) => { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; };

  // Ingresos, egresos y resultado
  const vals = [T.ventas, egresosTot, T.neto];
  nuevo($('gIER'), {

    options: { maintainAspectRatio: false, cutout: '58%', plugins: { legend: { display: false },
      tooltip: { callbacks: { label: c => ` ${c.label}: ${money(c.raw)} (${p1(c.raw, egresosTot)} de los egresos)` } } } },
  });

  // Resultado por show: en montos, barras agrupadas; en %, barra 100% apilada (egresos + resultado)
  const base = { type: 'bar', options: { indexAxis: 'y', maintainAspectRatio: false, onClick: clicShow, onHover: cursor,
    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, padding: 16 } }, tooltip: tip } } };
  const etiquetasShows = shows.map(s => `${s.nombre}  ${fecha(s.fecha).slice(0, 5)}`);
  if (!pct) {
    nuevo($('gShows'), { ...base, data: { labels: etiquetasShows, datasets: [
      { label: 'Ingresos', data: shows.map(s => s.ventas), bases: shows.map(s => s.ventas), backgroundColor: C.ing, borderRadius: 3, maxBarThickness: 18 },
      { label: 'Egresos', data: shows.map(egr), bases: shows.map(s => s.ventas), backgroundColor: C.egr, borderRadius: 3, maxBarThickness: 18 },
      { label: 'Resultado neto', data: shows.map(s => s.neto), bases: shows.map(s => s.ventas), backgroundColor: shows.map(s => colRes(s.neto)), borderRadius: 3, maxBarThickness: 18 },
    ] }, options: { ...base.options, layout: { padding: { right: 62 } }, scales: { x: { ...eje, beginAtZero: true }, y: sinGrilla } } });
  } else {

      ] }, options: { ...opts, layout: {}, scales: { y: { ...eje, stacked: true, min: 0, max: Math.max(100, ...meses.map(x => (x.ventas - x.neto) / x.ventas * 100)) }, x: { ...sinGrilla, stacked: true } } } });
    }
  }
}

// VERSIÓN EN VIDEO — presentación animada 16:9 dibujada con los mismos datos del informe
// ══════════════════════════════════════════════
const V = { W: 1920, H: 1080, escenas: [], dur: 0, t: 0, play: false, last: null, raf: null, cv: null, ctx: null, logo: null, rec: null, grabando: false, med: [], hits: [] };
const vF = (peso, px) => `${peso} ${px}px Poppins, system-ui, sans-serif`;
const vClamp = x => Math.max(0, Math.min(1, x));
const vEase = x => 1 - Math.pow(1 - vClamp(x), 3);
const vIn = (t, ini, dur = 0.5) => vClamp((t - ini) / dur);
function vRR(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function vLinea(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function vWrap(ctx, txt, x, y, maxW, lh) {
  const pal = String(txt).split(' '); let l = ''; const ls = [];
  for (const p of pal) { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > maxW && l) { ls.push(l); l = p; } else l = t; }
  if (l) ls.push(l); ls.forEach((x_, i) => ctx.fillText(x_, x, y + i * lh)); return ls.length;
}
// Eje con valores redondos: paso "lindo" y límites múltiplos del paso (la escala arranca en cero)
function vEje(min, max) {
  const lindo = v => { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
  const paso = lindo(Math.max(Math.abs(min), Math.abs(max)) / 4);
  return { min: Math.min(0, Math.floor(min / paso) * paso), max: Math.max(paso, Math.ceil(max / paso) * paso), paso };
}

function vFondo(ctx, i) {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, V.W, V.H);
  ctx.fillStyle = C.ing; ctx.fillRect(0, 0, V.W, 10);
  const e = V.escenas[i];
  if (e.marco !== false) {
    if (V.logo) { ctx.save(); vRR(ctx, 120, 990, 46, 46, 8); ctx.clip(); ctx.drawImage(V.logo, 120, 990, 46, 46); ctx.restore(); }
    ctx.fillStyle = C.muted; ctx.font = vF(400, 22); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`Show Business Solutions · Informe de resultados, Movistar Arena · ${V.data.per}`, 184, 1013);
    // avance por escenas
    const n = V.escenas.length;
    for (let k = 0; k < n; k++) { ctx.fillStyle = k === i ? C.ing : '#d4d8d5'; ctx.beginPath(); ctx.arc(V.W - 120 - (n - 1 - k) * 26, 1013, k === i ? 7 : 5, 0, Math.PI * 2); ctx.fill(); }
  }
}
function vTitulo(ctx, t, titulo, sub) {
  const a = vEase(vIn(t, 0.1, 0.6)); ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = '#1f2421'; ctx.font = vF(600, 58); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(titulo, 120, 150 + (1 - a) * 20);
  if (sub) { ctx.fillStyle = C.muted; ctx.font = vF(400, 30); ctx.fillText(sub, 120, 200 + (1 - a) * 20); }
  ctx.restore();
}
function vTexto(ctx, t, ini, txt) {
  const a = vEase(vIn(t, ini, 0.6)); if (!a) return;
  ctx.save(); ctx.globalAlpha *= a;
  // Si el texto no entra en dos renglones, se achica la letra para no pisar el pie de la diapositiva
  const lineas = (px) => { ctx.font = vF(500, px); const pal = String(txt).split(' '); let l = '', n = 0; for (const p of pal) { const t2 = l ? l + ' ' + p : p; if (ctx.measureText(t2).width > 1640 && l) { n++; l = p; } else l = t2; } return n + (l ? 1 : 0); };
  let px = 34; while (px > 24 && lineas(px) > 2) px -= 2;
  const lh = Math.round(px * 1.3), alto = Math.min(2, lineas(px)) * lh - (lh - px);
  ctx.fillStyle = C.neto; ctx.fillRect(120, 884, 7, Math.max(alto + 6, 40));
  ctx.fillStyle = '#1f2421'; ctx.font = vF(500, px); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  vWrap(ctx, txt, 152, 884, 1640, lh);
  ctx.restore();
}
const vLeyenda = (ctx, items, xDer, y) => {
  ctx.font = vF(500, 24); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let x = xDer; const anchos = items.map(([t]) => ctx.measureText(t).width + 70);
  x -= anchos.reduce((a, b) => a + b, 0);
  items.forEach(([t, c], i) => { ctx.fillStyle = c; vRR(ctx, x, y - 11, 22, 22, 4); ctx.fill(); ctx.fillStyle = '#1f2421'; ctx.fillText(t, x + 32, y); x += anchos[i]; });
};

function escResumen(ctx, t) {

function escIER(ctx, t) {
  const { T, eg } = V.data;
  vTitulo(ctx, t, 'Ingresos, egresos y resultado', 'Lo que entró, lo que salió y lo que quedó');
  const vals = [T.ventas, eg, T.neto], cols = [C.ing, C.egr, T.neto >= 0 ? C.neto : C.loss], labs = ['Ingresos', 'Egresos', 'Resultado neto'];
  const ax = vEje(Math.min(0, ...vals), Math.max(...vals));
  const x0 = 380, x1 = 1540, yT = 290, yB = 790;
  const yv = v => yB - (v - ax.min) / (ax.max - ax.min) * (yB - yT);
  ctx.save(); ctx.globalAlpha *= vIn(t, 0.2, 0.5);
  ctx.font = vF(400, 24); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';

function vHit(x, y) {
  for (let i = V.hits.length - 1; i >= 0; i--) {
    const h = V.hits[i];
    if (h.r) { const [a, b, w, hh] = h.r; if (x >= a && x <= a + w && y >= b && y <= b + hh) return h; }
    else if (h.arc) {

function vTip(e, h) {

function vConectarEventos() {
  const cv = V.cv;

  const fijar = (e, h) => { if (V.play) vPausar(); vTip(e, h); V.tipFijo = true; };
  cv.addEventListener('pointermove', e => {
    if (V.grabando || e.pointerType === 'touch') return;

    if (h) { fijar(e, h); return; }                          // barra, porción o renglón: valor exacto
    if (V.tipFijo) { vSoltarTip(); return; }                 // tocar afuera cierra el valor

function vPreparar() {

function vDibujar() {
  const ctx = V.ctx; if (!ctx) return;
  V.med = []; V.hits = [];
  let acc = 0;
  for (let i = 0; i < V.escenas.length; i++) {
    const e = V.escenas[i];
    if (V.t < acc + e.dur || i === V.escenas.length - 1) {
      const lt = Math.min(Math.max(0, V.t - acc), e.dur);
      vFondo(ctx, i);
      ctx.save();
      const ultima = i === V.escenas.length - 1;
      ctx.globalAlpha = Math.min(1, i === 0 ? 1 : lt / 0.45, ultima ? 1 : (e.dur - lt) / 0.45);
      e.draw(ctx, lt, e.dur);
      ctx.restore();
      break;

    acc += e.dur;

  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const tm = $('vtime'); if (tm) tm.textContent = `${mmss(V.t)} / ${mmss(V.dur)}`;
  const sk = $('vseek'); if (sk && !V.arrastrando) sk.value = Math.round(V.t / V.dur * 1000);
  const pb = $('vplay'); if (pb) pb.textContent = V.play ? 'Pausa' : (V.t >= V.dur ? 'Ver de nuevo' : 'Reproducir');
  const ci = vCapActual();

function vBucle(ts) {

}
function vReproducir() { if (V.tipFijo) vSoltarTip(); if (V.t >= V.dur) V.t = 0; V.play = true; V.last = null; cancelAnimationFrame(V.raf); V.raf = requestAnimationFrame(vBucle); vDibujar(); vMostrarControles(); vEstadoPausa(); }

window.vPantallaCompleta = async function() {

  const antes = box?.classList.contains('esfull');
  box?.classList.toggle('esfull', en);
  // El aviso de controles espera a que desaparezca el cartel de Chrome ("pulsá Esc para salir"), que aparece arriba al centro
  if (en && !antes) { document.activeElement?.blur?.(); clearTimeout(V.tAvisoIni); V.tAvisoIni = setTimeout(() => { if (vEnPantalla()) vAviso('Clic sobre un gráfico: ver valores y detalles  ·  Espacio: pausa  ·  ← →: capítulos  ·  Esc: salir', 4500); }, 3000); }
  if (!en) vSoltarTip();
  vMostrarControles(); vEstadoPausa();
}
// En pantalla completa, los controles se esconden solos mientras se reproduce
function vMostrarControles() {
  const box = document.querySelector('#vov .vbox'); if (!box) return;
  box.classList.remove('quieto'); clearTimeout(V.tQuieto);
  if (vEnPantalla() && V.play && !V.grabando) V.tQuieto = setTimeout(() => box.classList.add('quieto'), 2600);
}
document.addEventListener('keyup', e => { if ((e.key === ' ' || e.code === 'Space') && $('vov')?.style.display === 'flex' && S.abierto == null) e.preventDefault(); }, true);
document.addEventListener('fullscreenchange', vFsUI);
document.addEventListener('webkitfullscreenchange', vFsUI);

window.abrirVideo = async function() {
  vPreparar();
  if (!$('vov')) {
    const ov = document.createElement('div');
    ov.id = 'vov'; ov.className = 'vov';
    ov.innerHTML = `<div class="vbox" role="dialog" aria-modal="true" aria-label="Versión en video del informe">
      <div class="vtop"><div><b>Versión en video</b><span id="vper"></span></div><button class="x" onclick="cerrarVideo()" aria-label="Cerrar">×</button></div>
      <div class="vstage" id="vstage"><canvas id="vcv" width="${V.W}" height="${V.H}" aria-label="Presentación animada del informe"></canvas><div class="vtip" id="vtip" role="status"></div><div class="vaviso" id="vaviso" aria-live="polite"></div><div class="vpausa" id="vpausa">❚❚ En pausa · espacio para seguir</div></div>
      <div class="vpanel" id="vpanel">
      <div class="vcaps" id="vcaps" aria-label="Capítulos"></div>
      <div class="vctl">
        <button class="btn" id="vplay" onclick="vToggle()">Pausa</button>
        <button class="btn" onclick="vReiniciar()">Reiniciar</button>
        <input type="range" id="vseek" min="0" max="1000" value="0" aria-label="Avance del video"
          onpointerdown="V.arrastrando=true" onpointerup="V.arrastrando=false" oninput="vSeek(this.value)">
        <span id="vtime" class="vtime">0:00</span>
        <button class="btn" id="vfs" onclick="vPantallaCompleta()" title="Pantalla completa (tecla F)">⛶ Pantalla completa</button>
        <button class="btn btn-dl" id="vdl" onclick="descargarVideo()">Descargar video</button>
      </div>
      <div class="vmeses" id="vmeses" aria-label="Período del video"></div>
      <div class="vayuda">Clic sobre un gráfico para ver su valor exacto (el video se pausa); sobre un show, para ver su detalle${S.d.tipo === 'anio' ? '; sobre un mes, para ver el video de ese mes' : ''}. Atajos: espacio pausa, ← → capítulos, F pantalla completa, Esc cierra.</div>
      <div id="vrec" class="vrec"></div>
      </div>
    </div>`;
    ov.addEventListener('click', e => { if (e.target === ov) cerrarVideo(); });
    ov.addEventListener('pointermove', vMostrarControles);
    ov.addEventListener('pointerdown', vMostrarControles);
    document.body.appendChild(ov);
  }
  $('vov').style.display = 'flex';
  V.cv = $('vcv'); V.ctx = V.cv.getContext('2d');
  if (!V.eventos) { vConectarEventos(); V.eventos = true; }
  vUI();
  if (!V.logo) { V.logo = new Image(); V.logo.src = LOGO; await V.logo.decode().catch(() => {}); }
  if (document.fonts?.load) await Promise.race([Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 40px Poppins`))), new Promise(r => setTimeout(r, 1500))]);
  V.t = 0; vReproducir();
};
window.cerrarVideo = function() {
  if (V.grabando && !confirm('Se está grabando el video. ¿Cancelar la grabación?')) return;
  if (V.grabando) { V.cancelada = true; V.rec?.stop(); }
  vPausar(); vSalirPantalla(); const ov = $('vov'); if (ov) ov.style.display = 'none';
};

window.descargarVideo = function() {
  if (V.grabando) return;
  if (!window.MediaRecorder || !V.cv?.captureStream) { alert('Este navegador no permite grabar el video. Probá con Google Chrome.'); return; }
  const tipos = ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const tipo = tipos.find(x => MediaRecorder.isTypeSupported(x));
  if (!tipo) { alert('Este navegador no permite grabar el video. Probá con Google Chrome.'); return; }
  const ext = tipo.startsWith('video/mp4') ? 'mp4' : 'webm';
  const stream = V.cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: tipo, videoBitsPerSecond: 8000000 });
  const partes = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
  rec.onstop = () => {
    V.grabando = false; V.alTerminar = null; stream.getTracks().forEach(tr => tr.stop());
    $('vdl').disabled = false; $('vdl').textContent = 'Descargar video';
    document.querySelectorAll('#vov .vctl button:not(#vdl), #vseek, #vcaps button, #vmeses button').forEach(b => b.disabled = false);
    if (V.cancelada) { V.cancelada = false; $('vrec').textContent = ''; return; }
    const blob = new Blob(partes, { type: tipo.split(';')[0] });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `SBS Movistar Arena - ${V.data.per}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    $('vrec').textContent = `Video descargado (${ext.toUpperCase()}, ${(blob.size / 1048576).toFixed(1)} MB).`;
  };
  V.rec = rec; V.grabando = true; V.cancelada = false;
  $('vdl').disabled = true;
  document.querySelectorAll('#vov .vctl button:not(#vdl), #vseek, #vcaps button, #vmeses button').forEach(b => b.disabled = true); $('vtip').style.display = 'none';
  const tick = () => { if (!V.grabando) return; $('vdl').textContent = `Grabando ${Math.floor(V.t)} de ${Math.round(V.dur)} s`; $('vrec').textContent = 'El video se graba en tiempo real: mantené esta pestaña abierta y visible hasta que termine.'; setTimeout(tick, 250); };
  V.alTerminar = () => setTimeout(() => rec.state !== 'inactive' && rec.stop(), 300);
  V.t = 0; vPausar(); rec.start(500); vReproducir(); tick();
};

(async function () {
  const params = new URLSearchParams(location.search);
  if (params.get('preview')) {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('sbs_informe_preview') || 'null'); } catch {}
    return d ? render(d, true) : estado('No hay una vista previa para mostrar. Generala desde la app.');
  }
  const t = params.get('t');
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) return estado('El link del informe no es válido.');
  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc('get_informe', { p_token: t });
    if (error || !data) return estado('No encontramos este informe. Puede que el link esté incompleto o que el informe se haya borrado.');
    render(data.data, false);
  } catch (e) {
    estado('No se pudo cargar el informe. Probá de nuevo en un momento.');
  }
})();
</script>
